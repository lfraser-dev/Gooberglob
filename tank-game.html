/* =====================================================

===================================================== */

function chooseFaction(faction) {

    selectedFaction =
        faction;

    selectedTankClass =
        null;


    document
        .getElementById(
            "britishButton"
        )
        .classList.remove(
            "selected"
        );


    document
        .getElementById(
            "germanButton"
        )
        .classList.remove(
            "selected"
        );


    document
        .getElementById(
            faction +
            "Button"
        )
        .classList.add(
            "selected"
        );


    createTankButtons();

}


/* =====================================================
   TANK BUTTONS
===================================================== */

function createTankButtons() {

    const container =
        document.getElementById(
            "tankChoices"
        );


    container.innerHTML = "";


    for (
        const type in
        tanks[selectedFaction]
    ) {

        const tank =
            tanks[selectedFaction]
            [type];


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "tankCard";


        button.innerHTML =

            tank.name +

            "<small>" +

            tank.className +

            "<br>" +

            "❤️ " +
            tank.health +

            " &nbsp; ⚡ " +
            tank.speed +

            "</small>";


        button.onclick =
            function() {

                selectedTankClass =
                    type;


                document
                    .querySelectorAll(
                        ".tankCard"
                    )
                    .forEach(
                        b =>
                        b.classList
                        .remove(
                            "selected"
                        )
                    );


                button.classList.add(
                    "selected"
                );

            };


        container.appendChild(
            button
        );

    }

}


/* =====================================================
   MAP SELECTION
===================================================== */

function chooseMap(map) {

    selectedMap =
        map;


    document
        .getElementById(
            "trenchButton"
        )
        .classList.remove(
            "selected"
        );


    document
        .getElementById(
            "townButton"
        )
        .classList.remove(
            "selected"
        );


    const id =
        map === "trenches"
        ? "trenchButton"
        : "townButton";


    document
        .getElementById(id)
        .classList.add(
            "selected"
        );

}


/* =====================================================
   START
===================================================== */

function startGame() {

    if (!selectedFaction) {

        alert(
            "Choose a faction first!"
        );

        return;

    }


    if (!selectedTankClass) {

        alert(
            "Choose a tank first!"
        );

        return;

    }


    if (!selectedMap) {

        alert(
            "Choose a battlefield first!"
        );

        return;

    }


    document
        .getElementById(
            "menu"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "gameArea"
        )
        .style.display =
        "block";


    createBattle();


    gameRunning =
        true;


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   CREATE BATTLE
===================================================== */

function createBattle() {

    const data =
        tanks[selectedFaction]
        [selectedTankClass];


    player = {

        x: 130,

        y: 350,

        angle: 0,

        health:
            data.health,

        maxHealth:
            data.health,

        speed:
            data.speed,

        damage:
            data.damage,

        reload:
            data.reload,

        size:
            data.size,

        name:
            data.name,

        model:
            data.model,

        faction:
            selectedFaction

    };


    document
        .getElementById(
            "tankName"
        )
        .textContent =
        player.name;


    createMap();

    createEnemies();

}

===================================================== */

    if (

/* =====================================================
   OBSTACLE
===================================================== */

function addObstacle(
    x,
    y,
    width,
    height,
    type
) {

    obstacles.push({

        x:
            x,

        y:
            y,

        width:
            width,

        height:
            height,

        type:
            type

    });

}


/* =====================================================
   ENEMIES
===================================================== */

function createEnemies() {

    enemies = [];


    const enemyFaction =
        selectedFaction ===
        "british"

        ? "german"

        : "british";


    const types = [

        "light",
        "medium",
        "heavy"

    ];


    const positions = [

        [930, 130],

        [870, 350],

        [950, 570]

    ];


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const data =
            tanks[enemyFaction]
            [types[i]];


        enemies.push({

            x:
                positions[i][0],

            y:
                positions[i][1],

            angle:
                Math.PI,

            health:
                data.health,

            maxHealth:
                data.health,

            speed:
                data.speed *
                0.55,

            damage:
                data.damage,

            reload:
                data.reload +
                500,

            size:
                data.size,

            name:
                data.name,

            model:
                data.model,

            faction:
                enemyFaction,

            lastShot:
                0

        });

    }

}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = true;


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            shoot();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();


        mouse.x =
            (
                event.clientX -
                rect.left
            )
            *
            canvas.width /
            rect.width;


        mouse.y =
            (
                event.clientY -
                rect.top
            )
            *
            canvas.height /
            rect.height;

    }
);


canvas.addEventListener(
    "mousedown",
    function() {

        shoot();

    }
);


/* =====================================================
   COLLISION
===================================================== */

function tankHitsObstacle(
    tank,
    newX = tank.x,
    newY = tank.y
) {

    const solidTypes = [

        "building",
        "wall",
        "bunker",
        "wreck"

    ];


    for (
        const obstacle of
        obstacles
    ) {

        if (
            !solidTypes.includes(
                obstacle.type
            )
        ) {

            continue;

        }


        const closestX =
            Math.max(
                obstacle.x,

                Math.min(
                    newX,

                    obstacle.x +
                    obstacle.width
                )
            );


        const closestY =
            Math.max(
                obstacle.y,

                Math.min(
                    newY,

                    obstacle.y +
                    obstacle.height
                )
            );


        const dx =
            newX -
            closestX;


        const dy =
            newY -
            closestY;


        const distanceSquared =
            dx * dx +
            dy * dy;


        if (
            distanceSquared <
            tank.size *
            tank.size
        ) {

            return true;

        }

    }


    return false;

}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer() {

    if (!player) {
        return;
    }


    let dx = 0;

    let dy = 0;


    if (keys["w"]) {
        dy -= 1;
    }


    if (keys["s"]) {
        dy += 1;
    }


    if (keys["a"]) {
        dx -= 1;
    }


    if (keys["d"]) {
        dx += 1;
    }


    if (
        dx === 0 &&
        dy === 0
    ) {

        return;

    }


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    dx /= length;

    dy /= length;


    const moveX =
        dx *
        player.speed;


    const moveY =
        dy *
        player.speed;


    /*
       X MOVEMENT
    */

    const newX =
        player.x +
        moveX;


    if (
        !tankHitsObstacle(
            player,
            newX,
            player.y
        )
    ) {

        player.x =
            newX;

    }


    /*
       Y MOVEMENT
    */

    const newY =
        player.y +
        moveY;


    if (
        !tankHitsObstacle(
            player,
            player.x,
            newY
        )
    ) {

        player.y =
            newY;

    }


    /*
       MAP BOUNDARIES
    */

    player.x =
        Math.max(
            player.size,

            Math.min(
                canvas.width -
                player.size,

                player.x
            )
        );


    player.y =
        Math.max(
            player.size,

            Math.min(
                canvas.height -
                player.size,

                player.y
            )
        );

}


/* =====================================================
   AIM
===================================================== */

function aimPlayer() {

    if (!player) {
        return;
    }


    player.angle =
        Math.atan2(

            mouse.y -
            player.y,

            mouse.x -
            player.x

        );

}


/* =====================================================
   PLAYER SHOOT
===================================================== */

function shoot() {

    if (!gameRunning) {
        return;
    }


    const now =
        Date.now();


    if (
        now -
        lastShot <
        player.reload
    ) {

        return;

    }


    lastShot =
        now;


    bullets.push({

        x:
            player.x +
            Math.cos(
                player.angle
            ) *
            player.size *
            1.3,

        y:
            player.y +
            Math.sin(
                player.angle
            ) *
            player.size *
            1.3,

        vx:
            Math.cos(
                player.angle
            ) *
            9,

        vy:
            Math.sin(
                player.angle
            ) *
            9,

        damage:
            player.damage,

        enemy:
            false

    });

}


/* =====================================================
   AI
===================================================== */

function updateEnemies() {

    if (!player) {
        return;
    }


    enemies.forEach(
        function(enemy) {


            const dx =
                player.x -
                enemy.x;


            const dy =
                player.y -
                enemy.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
               AIM
            */

            enemy.angle =
                Math.atan2(
                    dy,
                    dx
                );


            /*
               MOVE TOWARD PLAYER
            */

            if (
                distance > 260
            ) {


                const moveX =
                    Math.cos(
                        enemy.angle
                    ) *
                    enemy.speed;


                const moveY =
                    Math.sin(
                        enemy.angle
                    ) *
                    enemy.speed;


                /*
                   X
                */

                const newX =
                    enemy.x +
                    moveX;


                if (
                    !tankHitsObstacle(
                        enemy,
                        newX,
                        enemy.y
                    )
                ) {

                    enemy.x =
                        newX;

                }


                /*
                   Y
                */

                const newY =
                    enemy.y +
                    moveY;


                if (
                    !tankHitsObstacle(
                        enemy,
                        enemy.x,
                        newY
                    )
                ) {

                    enemy.y =
                        newY;

                }

            }


            /*
               KEEP INSIDE MAP
            */

            enemy.x =
                Math.max(
                    enemy.size,

                    Math.min(
                        canvas.width -
                        enemy.size,

                        enemy.x
                    )
                );


            enemy.y =
                Math.max(
                    enemy.size,

                    Math.min(
                        canvas.height -
                        enemy.size,

                        enemy.y
                    )
                );


            /*
               SHOOT
            */

            const now =
                Date.now();


            if (

                distance < 700 &&

                now -
                enemy.lastShot >=
                enemy.reload

            ) {


                enemy.lastShot =
                    now;


                bullets.push({

                    x:
                        enemy.x +
                        Math.cos(
                            enemy.angle
                        ) *
                        enemy.size *
                        1.2,

                    y:
                        enemy.y +
                        Math.sin(
                            enemy.angle
                        ) *
                        enemy.size *
                        1.2,

                    vx:
                        Math.cos(
                            enemy.angle
                        ) *
                        6,

                    vy:
                        Math.sin(
                            enemy.angle
                        ) *
                        6,

                    damage:
                        enemy.damage,

                    enemy:
                        true

                });

            }

        }
    );

}


/* =====================================================
   BULLET UPDATE
===================================================== */

function updateBullets() {


    bullets.forEach(
        function(bullet) {

            bullet.x +=
                bullet.vx;

            bullet.y +=
                bullet.vy;

        }
    );


    /*
       REMOVE OFFSCREEN
    */

    bullets =
        bullets.filter(
            function(bullet) {

                return (

                    bullet.x > 0 &&

                    bullet.x <
                        canvas.width &&

                    bullet.y > 0 &&

                    bullet.y <
                        canvas.height

                );

            }
        );


    /*
       COLLISIONS
    */

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {


        const bullet =
            bullets[i];


        /*
           PLAYER BULLET
        */

        if (
            !bullet.enemy
        ) {


            for (
                let j =
                    enemies.length - 1;

                j >= 0;

                j--
            ) {


                const enemy =
                    enemies[j];


                const dx =
                    bullet.x -
                    enemy.x;


                const dy =
                    bullet.y -
                    enemy.y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance <
                    enemy.size
                ) {


                    enemy.health -=
                        bullet.damage;


                    bullets.splice(
                        i,
                        1
                    );


                    if (
                        enemy.health <=
                        0
                    ) {

                        enemies.splice(
                            j,
                            1
                        );

                    }


                    break;

                }

            }

        }


        /*
           ENEMY BULLET
        */

        else {


            const dx =
                bullet.x -
                player.x;


            const dy =
                bullet.y -
                player.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                player.size
            ) {


                player.health -=
                    bullet.damage;


                bullets.splice(
                    i,
                    1
                );

            }

        }

    }

}

function drawWire(o) {

        "#282923";

        o.x,
        o.y
    );

    ctx.lineTo(
        o.x +
        o.width,
        o.y +
        o.height
    );

    ctx.stroke();


    ctx.beginPath();

        o.x +
        o.width,
        o.y
    );

    ctx.lineTo(
        o.x,
        o.y +
        o.height
    );

    ctx.stroke();


    for (

/* =====================================================
   TANK DRAWING
===================================================== */

function drawTank(tank) {


    ctx.save();


    ctx.translate(
        tank.x,
        tank.y
    );


    ctx.rotate(
        tank.angle
    );


    /*
       SHADOW
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.35)";


    ctx.fillRect(
        -tank.size - 4,
        -tank.size + 5,
        tank.size * 2 + 8,
        tank.size * 1.7
    );


    drawTracks(tank);

    drawHull(tank);

    drawTurret(tank);

    drawCannon(tank);

    drawTankMarkings(tank);


    ctx.restore();


    /*
       HEALTH BAR
    */

    const barWidth =
        tank.size *
        2.3;


    ctx.fillStyle =
        "#201f18";


    ctx.fillRect(

        tank.x -
        barWidth / 2,

        tank.y -
        tank.size -
        15,

        barWidth,

        7

    );


    ctx.fillStyle =
        "#d5c45e";


    ctx.fillRect(

        tank.x -
        barWidth / 2,

        tank.y -
        tank.size -
        15,

        barWidth *
        Math.max(
            0,
            tank.health /
            tank.maxHealth
        ),

        7

    );

}

    ctx.fillStyle =
        "#20231d";


    ctx.fillRect(
        -s,
        -s * 0.78,
        s * 2,
        s * 0.28
    );


    ctx.fillRect(
        -s,
        s * 0.50,
        s * 2,
        s * 0.28
    );


    ctx.fillStyle =
        "#77745d";


    for (
        let x =
            -s + 7;

        x <
        s;

        x += 11
    ) {


        ctx.beginPath();

        ctx.arc(
            x,
            -s * 0.64,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            x,
            s * 0.64,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =====================================================
   HULLS
===================================================== */

function drawHull(tank) {


    const s =
        tank.size;


    let colour;


    if (
        tank.faction ===
        "british"
    ) {

        colour =
            "#53633b";

    }

    else {

        colour =
            "#77724e";

    }


    ctx.fillStyle =
        colour;


    switch (
        tank.model
    ) {


        case "tetrarch":

            ctx.fillRect(
                -s * 0.72,
                -s * 0.48,
                s * 1.45,
                s * 0.95
            );

            break;


        case "cromwell":

            ctx.beginPath();

            ctx.moveTo(
                -s,
                -s * 0.48
            );

            ctx.lineTo(
                s * 0.85,
                -s * 0.42
            );

            ctx.lineTo(
                s,
                s * 0.48
            );

            ctx.lineTo(
                -s,
                s * 0.48
            );

            ctx.closePath();

            ctx.fill();

            break;


        case "churchill":

            ctx.fillRect(
                -s * 1.05,
                -s * 0.58,
                s * 2.1,
                s * 1.15
            );

            break;


        case "panzer2":

            ctx.fillRect(
                -s * 0.72,
                -s * 0.42,
                s * 1.45,
                s * 0.84
            );

            break;


        case "panzer4":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.95,
                -s * 0.5
            );

            ctx.lineTo(
                s * 0.9,
                -s * 0.5
            );

            ctx.lineTo(
                s,
                s * 0.5
            );

            ctx.lineTo(
                -s * 0.95,
                s * 0.5
            );

            ctx.closePath();

            ctx.fill();

            break;


        case "tiger":

            ctx.fillRect(
                -s * 1.08,
                -s * 0.62,
                s * 2.15,
                s * 1.25
            );

            break;

    }

}

/* =====================================================

/* =====================================================
   BULLETS
===================================================== */

function drawBullets() {


    bullets.forEach(
        function(bullet) {


            ctx.fillStyle =
                "#e3d49a";


            ctx.beginPath();

            ctx.arc(
                bullet.x,
                bullet.y,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                "rgba(255,220,130,0.25)";


            ctx.beginPath();

            ctx.arc(

                bullet.x -
                bullet.vx *
                0.7,

                bullet.y -
                bullet.vy *
                0.7,

                8,

                0,

                Math.PI * 2

            );

            ctx.fill();

        }
    );

}

            "🏆 VICTORY! ENEMY FORCES DESTROYED";

            "block";

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {


    if (!gameRunning) {
        return;
    }


    movePlayer();


    aimPlayer();


    updateEnemies();


    updateBullets();


    drawMap();


    drawBullets();


    enemies.forEach(
        function(enemy) {

            drawTank(enemy);

        }
    );


    drawTank(
        player
    );


    updateUI();


    checkGameState();


    if (gameRunning) {

        requestAnimationFrame(
            gameLoop
        );

    }

}


</script>
