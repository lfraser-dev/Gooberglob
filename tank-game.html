        const type in tanks[selectedFaction]

            tanks[selectedFaction][type];

            document.createElement("button");

            "tankCard";

            tank.name +
            "<small>" +
            tank.className +
            "<br>" +
            "❤️ " + tank.health +
            " &nbsp; ⚡ " + tank.speed +
            "</small>";

        button.onclick = function() {

            selectedTankClass =
                type;

            document
                .querySelectorAll(".tankCard")
                .forEach(
                    function(button) {
                        button.classList
                            .remove("selected");
                    }
                );

            button.classList.add(
                "selected"
            );
        };

        container.appendChild(
            button
        );
    }
}

/* =====================================================
   OBSTACLE COLLISION
===================================================== */

function isSolidObstacle(
    obstacle
) {

    return [
        "building",
        "wall",
        "bunker",
        "wreck",
        "snowCabin",
        "rock"
    ].includes(
        obstacle.type
    );
}


function tankHitsObstacle(
    tank,
    newX = tank.x,
    newY = tank.y
) {

    for (
        const obstacle of obstacles
    ) {

        if (
            !isSolidObstacle(
                obstacle
            )
        ) {
            continue;
        }

        const closestX =
            Math.max(
                obstacle.x,
                Math.min(
                    newX,
                    obstacle.x +
                    obstacle.width
                )
            );

        const closestY =
            Math.max(
                obstacle.y,
                Math.min(
                    newY,
                    obstacle.y +
                    obstacle.height
                )
            );

        const dx =
            newX -
            closestX;

        const dy =
            newY -
            closestY;

        if (
            dx * dx +
            dy * dy <
            tank.size *
            tank.size
        ) {

            return true;
        }
    }

    return false;
}


/* =====================================================
   SAFE SPAWNS
===================================================== */

function validSpawnPoint(
    x,
    y,
    size
) {

    if (
        x < size + 10 ||
        x >
        canvas.width -
        size -
        10 ||
        y < size + 10 ||
        y >
        canvas.height -
        size -
        10
    ) {

        return false;
    }

    const fakeTank = {
        x,
        y,
        size
    };

    if (
        tankHitsObstacle(
            fakeTank,
            x,
            y
        )
    ) {

        return false;
    }

    if (player) {

        const distance =
            Math.hypot(
                x - player.x,
                y - player.y
            );

        if (
            distance < 220
        ) {

            return false;
        }
    }

    for (
        const enemy of enemies
    ) {

        const distance =
            Math.hypot(
                x - enemy.x,
                y - enemy.y
            );

        if (
            distance <
            size +
            enemy.size +
            35
        ) {

            return false;
        }
    }

    return true;
}


function findSpawnPoint(
    preferred,
    size
) {

    if (
        validSpawnPoint(
            preferred[0],
            preferred[1],
            size
        )
    ) {

        return {
            x: preferred[0],
            y: preferred[1]
        };
    }

    for (
        let y = 45;
        y < canvas.height - 45;
        y += 45
    ) {

        for (
            let x = 45;
            x < canvas.width - 45;
            x += 45
        ) {

            if (
                validSpawnPoint(
                    x,
                    y,
                    size
                )
            ) {

                return {
                    x,
                    y
                };
            }
        }
    }

    return {
        x:
            canvas.width -
            size -
            20,

        y:
            canvas.height / 2
    };
}

            );

            angle: Math.PI,
            turretAngle: Math.PI,

}

            shoot();

    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()

);


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();

        mouse.x =
            (
                event.clientX -
                rect.left
            ) *
            canvas.width /
            rect.width;

        mouse.y =
            (
                event.clientY -
                rect.top
            ) *
            canvas.height /
            rect.height;
    }
);


canvas.addEventListener(
    "mousedown",
    function() {

        shoot();
    }
);


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys.w) dy--;
    if (keys.s) dy++;
    if (keys.a) dx--;
    if (keys.d) dx++;

    if (
        dx === 0 &&
        dy === 0
    ) {

        return;
    }

    const length =
        Math.hypot(
            dx,
            dy
        );

    dx /= length;
    dy /= length;

    player.angle =
        Math.atan2(
            dy,
            dx
        );

    const moveX =
        dx * player.speed;

    const moveY =
        dy * player.speed;

    if (
        !tankHitsObstacle(
            player,
            player.x + moveX,
            player.y
        )
    ) {

        player.x += moveX;
    }

    if (
        !tankHitsObstacle(
            player,
            player.x,
            player.y + moveY
        )
    ) {

        player.y += moveY;
    }

    player.x =
        Math.max(
            player.size,
            Math.min(
                canvas.width -
                player.size,
                player.x
            )
        );

    player.y =
        Math.max(
            player.size,
            Math.min(
                canvas.height -
                player.size,
                player.y
            )
        );

    addTrackMarks(
        player
    );
}


/* =====================================================
   PLAYER AIM
===================================================== */

function aimPlayer() {

    player.turretAngle =
        Math.atan2(
            mouse.y -
            player.y,

            mouse.x -
            player.x
        );
}


/* =====================================================
   SHOOT
===================================================== */

function shoot() {

    if (
        !gameRunning ||
        !player
    ) {

        return;
    }

    const now =
        Date.now();

    if (
        now -
        lastShot <
        player.reload
    ) {

        return;
    }

    lastShot = now;

    createShell(
        player,
        false
    );

    createMuzzleFlash(
        player
    );

    player.fireSmoke = 12;
}

/* =====================================================
   SHELL COLLISION
===================================================== */

function lineHitsRectangle(
    x1,
    y1,
    x2,
    y2,
    rect
) {

    const steps = 14;

    for (
        let i = 0;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;

        const x =
            x1 +
            (x2 - x1) * t;

        const y =
            y1 +
            (y2 - y1) * t;

        if (
            x >= rect.x &&
            x <=
                rect.x +
                rect.width &&
            y >= rect.y &&
            y <=
                rect.y +
                rect.height
        ) {

            return true;
        }
    }

    return false;
}


function shellHitsObstacle(
    x1,
    y1,
    x2,
    y2
) {

    for (
        const obstacle of obstacles
    ) {

        if (
            !isSolidObstacle(
                obstacle
            )
        ) {

            continue;
        }

        if (
            lineHitsRectangle(
                x1,
                y1,
                x2,
                y2,
                obstacle
            )
        ) {

            return obstacle;
        }
    }

    return null;
}


/* =====================================================
   DAMAGE CALCULATION
===================================================== */

function calculateDamage(
    shell,
    target
) {

    /*
       Basic armour reduction.
    */

    let damage =
        shell.damage *
        target.armor;


    /*
       HIT LOCATION

       Centre hits do normal damage.
       Edge hits do reduced damage.
       Rear/side effects can be added
       later with the AI upgrade.
    */

    const distance =
        Math.hypot(
            shell.x - target.x,
            shell.y - target.y
        );

    const edgeRatio =
        distance /
        target.size;

    if (
        edgeRatio > 0.75
    ) {

        damage *= 0.72;

        createHitText(
            shell.x,
            shell.y,
            "GLANCING HIT"
        );
    }

    else if (
        edgeRatio < 0.35
    ) {

        damage *= 1.20;

        createHitText(
            shell.x,
            shell.y,
            "DIRECT HIT!"
        );
    }

    else {

        createHitText(
            shell.x,
            shell.y,
            "HIT"
        );
    }

    return Math.max(
        3,
        Math.round(damage)
    );
}

/* =====================================================
   UPDATE SHELLS
===================================================== */

function updateShells() {

    for (
        let i =
            shells.length - 1;

        i >= 0;

        i--
    ) {

        const shell =
            shells[i];

        shell.oldX =
            shell.x;

        shell.oldY =
            shell.y;

        shell.x +=
            shell.vx;

        shell.y +=
            shell.vy;

        shell.life--;

        /*
           BUILDING HIT
        */

        if (
            shellHitsObstacle(
                shell.oldX,
                shell.oldY,
                shell.x,
                shell.y
            )
        ) {

            createExplosion(
                shell.x,
                shell.y,
                0.65
            );

            shells.splice(
                i,
                1
            );

            continue;
        }


        /*
           OUT OF BOUNDS
        */

        if (
            shell.x < 0 ||
            shell.x >
                canvas.width ||
            shell.y < 0 ||
            shell.y >
                canvas.height ||
            shell.life <= 0
        ) {

            shells.splice(
                i,
                1
            );

            continue;
        }


        /*
           PLAYER SHELL
        */

        if (
            !shell.enemy
        ) {

            let hit =
                false;

            for (
                let j =
                    enemies.length - 1;

                j >= 0;

                j--
            ) {

                const enemy =
                    enemies[j];

                const distance =
                    Math.hypot(
                        shell.x -
                            enemy.x,
                        shell.y -
                            enemy.y
                    );

                if (
                    distance <
                    enemy.size
                ) {

                    const damage =
                        calculateDamage(
                            shell,
                            enemy
                        );

                    enemy.health -=
                        damage;

                    createImpact(
                        shell.x,
                        shell.y
                    );

                    createHitSparks(
                        shell.x,
                        shell.y
                    );

                    enemy.fireSmoke =
                        Math.min(
                            25,
                            enemy.fireSmoke +
                            6
                        );

                    shells.splice(
                        i,
                        1
                    );

                    hit = true;


                    /*
                       DESTROYED
                    */

                    if (
                        enemy.health <= 0
                    ) {

                        destroyTank(
                            enemy
                        );

                        enemies.splice(
                            j,
                            1
                        );
                    }

                    break;
                }
            }

            if (hit) {
                continue;
            }
        }


        /*
           ENEMY SHELL
        */

        else {

            const distance =
                Math.hypot(
                    shell.x -
                        player.x,
                    shell.y -
                        player.y
                );

            if (
                distance <
                player.size
            ) {

                const damage =
                    calculateDamage(
                        shell,
                        player
                    );

                player.health -=
                    damage;

                player.fireSmoke =
                    Math.min(
                        25,
                        player.fireSmoke +
                        6
                    );

                createImpact(
                    shell.x,
                    shell.y
                );

                createHitSparks(
                    shell.x,
                    shell.y
                );

                shells.splice(
                    i,
                    1
                );

                if (
                    player.health <= 0
                ) {

                    destroyTank(
                        player
                    );
                }
            }
        }
    }
}

/* =====================================================
   TRACK MARKS
===================================================== */

function addTrackMarks(
    tank
) {

    tank.trackTimer++;

    if (
        tank.trackTimer < 5
    ) {

        return;
    }

    tank.trackTimer = 0;

    const cos =
        Math.cos(
            tank.angle
        );

    const sin =
        Math.sin(
            tank.angle
        );

    const sideX =
        -sin *
        tank.size *
        0.65;

    const sideY =
        cos *
        tank.size *
        0.65;

    const backX =
        -cos *
        tank.size *
        0.5;

    const backY =
        -sin *
        tank.size *
        0.5;

    trackMarks.push({

        x1:
            tank.x +
            sideX +
            backX,

        y1:
            tank.y +
            sideY +
            backY,

        x2:
            tank.x -
            sideX +
            backX,

        y2:
            tank.y -
            sideY +
            backY,

        life: 260
    });
}


function updateTrackMarks() {

    for (
        let i =
            trackMarks.length - 1;

        i >= 0;

        i--
    ) {

        trackMarks[i].life--;

        if (
            trackMarks[i].life <= 0
        ) {

            trackMarks.splice(
                i,
                1
            );
        }
    }
}


function drawTrackMarks() {

    ctx.strokeStyle =
        "rgba(35,35,30,0.35)";

    ctx.lineWidth = 4;

    trackMarks.forEach(
        function(mark) {

            ctx.globalAlpha =
                mark.life / 260;

            ctx.beginPath();

            ctx.moveTo(
                mark.x1,
                mark.y1
            );

            ctx.lineTo(
                mark.x2,
                mark.y2
            );

            ctx.stroke();
        }
    );

    ctx.globalAlpha = 1;
}


/* =====================================================
   ENEMY AI
   STAGE 2 WILL UPGRADE THIS
===================================================== */

function updateEnemies() {

    if (!player) {
        return;
    }

    enemies.forEach(
        function(enemy) {

            const dx =
                player.x -
                enemy.x;

            const dy =
                player.y -
                enemy.y;

            const distance =
                Math.hypot(
                    dx,
                    dy
                );

            enemy.turretAngle =
                Math.atan2(
                    dy,
                    dx
                );

            /*
               For now all tanks use
               the simple AI.

               STAGE 2 will make
               light / medium / heavy
               behave differently.
            */

            if (
                distance > 260
            ) {

                const moveAngle =
                    Math.atan2(
                        dy,
                        dx
                    );

                enemy.angle =
                    moveAngle;

                const moveX =
                    Math.cos(
                        moveAngle
                    ) *
                    enemy.speed;

                const moveY =
                    Math.sin(
                        moveAngle
                    ) *
                    enemy.speed;

                if (
                    !tankHitsObstacle(
                        enemy,
                        enemy.x + moveX,
                        enemy.y
                    )
                ) {

                    enemy.x +=
                        moveX;
                }

                if (
                    !tankHitsObstacle(
                        enemy,
                        enemy.x,
                        enemy.y + moveY
                    )
                ) {

                    enemy.y +=
                        moveY;
                }

                addTrackMarks(
                    enemy
                );
            }


            enemy.x =
                Math.max(
                    enemy.size,
                    Math.min(
                        canvas.width -
                        enemy.size,
                        enemy.x
                    )
                );

            enemy.y =
                Math.max(
                    enemy.size,
                    Math.min(
                        canvas.height -
                        enemy.size,
                        enemy.y
                    )
                );


            const now =
                Date.now();

            if (
                distance < 700 &&
                now -
                enemy.lastShot >=
                enemy.reload
            ) {

                if (
                    !shotBlocked(
                        enemy.x,
                        enemy.y,
                        player.x,
                        player.y
                    )
                ) {

                    enemy.lastShot =
                        now;

                    createShell(
                        enemy,
                        true
                    );

                    createMuzzleFlash(
                        enemy
                    );

                    enemy.fireSmoke =
                        12;
                }
            }
        }
    );
}


/* =====================================================
   SHOT BLOCKED
===================================================== */

function shotBlocked(

    y1,
    x2,
    y2
) {

    return !!shellHitsObstacle(
        x1,
        y1,
        x2,
        y2
    );
}

/* =====================================================
   TANK DRAWING
===================================================== */

function drawTank(
    tank
) {

    if (
        tank.destroyed
    ) {

        return;
    }

    ctx.save();

    ctx.translate(
        tank.x,
        tank.y
    );

    ctx.rotate(
        tank.angle
    );

    drawTankHull(
        tank
    );

    ctx.restore();


    ctx.save();

    ctx.translate(
        tank.x,
        tank.y
    );

    ctx.rotate(
        tank.turretAngle
    );

    drawTurret(
        tank
    );

    ctx.restore();


    /*
       HEALTH BAR
    */

    const barWidth =
        tank.size * 2.3;

    ctx.fillStyle =
        "#201f18";

    ctx.fillRect(
        tank.x -
        barWidth / 2,

        tank.y -
        tank.size -
        15,

        barWidth,
        7
    );

    ctx.fillStyle =
        tank.health <
        tank.maxHealth *
        0.25
        ? "#c94b32"
        : "#d5c45e";

    ctx.fillRect(
        tank.x -
        barWidth / 2,

        tank.y -
        tank.size -
        15,

        barWidth *
        Math.max(
            0,
            tank.health /
            tank.maxHealth
        ),

        7
    );
}


/* =====================================================
   TANK HULL
===================================================== */

function drawTankHull(
    tank
) {

    const s =
        tank.size;

    let colour;

    if (
        tank.faction ===
        "british"
    ) {

        colour =
            "#53633b";
    }

    else if (
        tank.faction ===
        "german"
    ) {

        colour =
            "#77724e";
    }

    else {

        colour =
            "#4d6738";
    }


    /*
       SHADOW
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.35)";

    ctx.fillRect(
        -s - 4,
        -s + 5,
        s * 2 + 8,
        s * 1.7
    );


    /*
       TRACKS
    */

    ctx.fillStyle =
        "#20231d";

    ctx.fillRect(
        -s,
        -s * 0.78,
        s * 2,
        s * 0.28
    );

    ctx.fillRect(
        -s,
        s * 0.50,
        s * 2,
        s * 0.28
    );


    /*
       TRACK WHEELS
    */

    ctx.fillStyle =
        "#77745d";

    for (
        let x =
            -s + 7;

        x < s;

        x += 11
    ) {

        ctx.beginPath();

        ctx.arc(
            x,
            -s * 0.64,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            x,
            s * 0.64,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
       HULL
    */

    ctx.fillStyle =
        colour;

    switch (
        tank.model
    ) {

        case "tetrarch":

            ctx.fillRect(
                -s * 0.72,
                -s * 0.48,
                s * 1.45,
                s * 0.95
            );

            break;

        case "cromwell":

            ctx.beginPath();

            ctx.moveTo(
                -s,
                -s * 0.48
            );

            ctx.lineTo(
                s * 0.85,
                -s * 0.42
            );

            ctx.lineTo(
                s,
                s * 0.48
            );

            ctx.lineTo(
                -s,
                s * 0.48
            );

            ctx.closePath();

            ctx.fill();

            break;

        case "churchill":

            ctx.fillRect(
                -s * 1.05,
                -s * 0.58,
                s * 2.1,
                s * 1.15
            );

            break;

        case "panzer2":

            ctx.fillRect(
                -s * 0.72,
                -s * 0.42,
                s * 1.45,
                s * 0.84
            );

            break;

        case "panzer4":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.95,
                -s * 0.5
            );

            ctx.lineTo(
                s * 0.9,
                -s * 0.5
            );

            ctx.lineTo(
                s,
                s * 0.5
            );

            ctx.lineTo(
                -s * 0.95,
                s * 0.5
            );

            ctx.closePath();

            ctx.fill();

            break;

        case "tiger":

            ctx.fillRect(
                -s * 1.08,
                -s * 0.62,
                s * 2.15,
                s * 1.25
            );

            break;

        case "t70":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.8,
                -s * 0.45
            );

            ctx.lineTo(
                s * 0.8,
                -s * 0.45
            );

            ctx.lineTo(
                s * 0.95,
                s * 0.4
            );

            ctx.lineTo(
                -s * 0.9,
                s * 0.4
            );

            ctx.closePath();

            ctx.fill();

            break;

        case "t34":

            ctx.beginPath();

            ctx.moveTo(
                -s,
                -s * 0.5
            );

            ctx.lineTo(
                s * 0.75,
                -s * 0.6
            );

            ctx.lineTo(
                s,
                s * 0.35
            );

            ctx.lineTo(
                -s * 0.9,
                s * 0.5
            );

            ctx.closePath();

            ctx.fill();

            break;

        case "is2":

            ctx.fillRect(
                -s * 1.08,
                -s * 0.6,
                s * 2.16,
                s * 1.2
            );

            break;
    }
}


/* =====================================================
   TURRET
===================================================== */

function drawTurret(
    tank
) {

    const s =
        tank.size;

    let colour;

    if (
        tank.faction ===
        "british"
    ) {

        colour =
            "#657448";
    }

    else if (
        tank.faction ===
        "german"
    ) {

        colour =
            "#8b855d";
    }

    else {

        colour =
            "#5d7845";
    }

    ctx.fillStyle =
        colour;


    switch (
        tank.model
    ) {

        case "tetrarch":

            ctx.fillRect(
                -s * 0.42,
                -s * 0.35,
                s * 0.7,
                s * 0.7
            );

            break;

        case "cromwell":

            ctx.fillRect(
                -s * 0.45,
                -s * 0.42,
                s * 0.9,
                s * 0.84
            );

            break;

        case "churchill":

            ctx.fillRect(
                -s * 0.5,
                -s * 0.48,
                s,
                s * 0.96
            );

            break;

        case "panzer2":

            ctx.fillRect(
                -s * 0.38,
                -s * 0.38,
                s * 0.72,
                s * 0.72
            );

            break;

        case "panzer4":

            ctx.fillRect(
                -s * 0.48,
                -s * 0.43,
                s * 0.9,
                s * 0.86
            );

            break;

        case "tiger":

            ctx.fillRect(
                -s * 0.52,
                -s * 0.5,
                s * 1.05,
                s
            );

            break;

        case "t70":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.4,
                -s * 0.4
            );

            ctx.lineTo(
                s * 0.35,
                -s * 0.28
            );

            ctx.lineTo(
                s * 0.4,
                s * 0.4
            );

            ctx.lineTo(
                -s * 0.4,
                s * 0.3
            );

            ctx.closePath();

            ctx.fill();

            break;

        case "t34":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.48,
                -s * 0.4
            );

            ctx.lineTo(
                s * 0.4,
                -s * 0.38
            );

            ctx.lineTo(
                s * 0.45,
                s * 0.4
            );

            ctx.lineTo(
                -s * 0.5,
                s * 0.35
            );

            ctx.closePath();

            ctx.fill();

            break;

        case "is2":

            ctx.fillRect(
                -s * 0.52,
                -s * 0.5,
                s * 1.05,
                s
            );

            break;
    }


    /*
       TURRET CENTRE
    */

    ctx.fillStyle =
        "#34382a";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        s * 0.25,
        0,
        Math.PI * 2
    );

    ctx.fill();


    drawCannon(
        tank
    );

    drawTankMarkings(
        tank
    );
}


/* =====================================================
   CANNON
===================================================== */

function drawCannon(
    tank
) {

    const s =
        tank.size;

    let length =
        s * 1.3;

    let width = 6;

    switch (
        tank.model
    ) {

        case "tetrarch":
            length = s * 1.15;
            width = 5;
            break;

        case "cromwell":
            length = s * 1.55;
            width = 6;
            break;

        case "churchill":
            length = s * 1.45;
            width = 8;
            break;

        case "panzer2":
            length = s * 1.1;
            width = 5;
            break;

        case "panzer4":
            length = s * 1.6;
            width = 6;
            break;

        case "tiger":
            length = s * 1.85;
            width = 9;
            break;

        case "t70":
            length = s * 1.25;
            width = 5;
            break;

        case "t34":
            length = s * 1.65;
            width = 7;
            break;

        case "is2":
            length = s * 1.9;
            width = 9;
            break;
    }

    ctx.fillStyle =
        "#242820";

    ctx.fillRect(
        0,
        -width / 2,
        length,
        width
    );

    ctx.fillRect(
        length - 7,
        -width / 2 - 2,
        10,
        width + 4
    );
}


/* =====================================================
   MARKINGS
===================================================== */

function drawTankMarkings(
    tank
) {

    const s =
        tank.size;

    if (
        tank.faction ===
        "british"
    ) {

        ctx.strokeStyle =
            "#ddd7ba";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.arc(
            -s * 0.35,
            0,
            s * 0.15,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    else if (
        tank.faction ===
        "german"
    ) {

        ctx.fillStyle =
            "#24251e";

        ctx.fillRect(
            -s * 0.15,
            -4,
            s * 0.3,
            8
        );

        ctx.fillRect(
            -4,
            -s * 0.15,
            8,
            s * 0.3
        );
    }

    else {

        ctx.fillStyle =
            "#c7c7bd";

        ctx.fillRect(
            -s * 0.38,
            -3,
            s * 0.76,
            6
        );

        ctx.fillRect(
            -3,
            -s * 0.38,
            6,
            s * 0.76
        );
    }
}


/* =====================================================
   SHELL DRAWING
===================================================== */

function drawShells() {

    shells.forEach(
        function(shell) {

            /*
               SHELL TRAIL
            */

            ctx.strokeStyle =
                "#d6b65c";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.moveTo(
                shell.x -
                shell.vx * 1.5,

                shell.y -
                shell.vy * 1.5
            );

            ctx.lineTo(
                shell.x,
                shell.y
            );

            ctx.stroke();


            /*
               SHELL
            */

            ctx.save();

            ctx.translate(
                shell.x,
                shell.y
            );

            ctx.rotate(
                Math.atan2(
                    shell.vy,
                    shell.vx
                )
            );

            ctx.fillStyle =
                "#d0b45d";

            ctx.fillRect(
                -7,
                -3,
                14,
                6
            );

            ctx.beginPath();

            ctx.moveTo(
                7,
                -3
            );

            ctx.lineTo(
                12,
                0
            );

            ctx.lineTo(
                7,
                3
            );

            ctx.closePath();

            ctx.fill();

            ctx.fillStyle =
                "#50472e";

            ctx.fillRect(
                -8,
                -3,
                4,
                6
            );

            ctx.restore();
        }
    );
}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    document
        .getElementById(
            "playerHealth"
        )
        .textContent =
        Math.max(
            0,
            Math.floor(
                player.health
            )
        );

    document
        .getElementById(
            "enemyCount"
        )
        .textContent =
        enemies.length;
}


/* =====================================================
   GAME STATE
===================================================== */

function checkGameState() {

    if (
        player.health <= 0
    ) {

        gameRunning = false;

        document
            .getElementById(
                "battleMessage"
            )
            .textContent =
            "💀 YOUR TANK HAS BEEN DESTROYED";

        document
            .getElementById(
                "restartButton"
            )
            .style.display =
            "block";

        return;
    }


    if (
        enemies.length === 0
    ) {

        gameRunning = false;

        document
            .getElementById(
                "battleMessage"
            )
            .textContent =
            "🏆 VICTORY! ENEMY FORCES DESTROYED";

        document
            .getElementById(
                "restartButton"
            )
            .style.display =
            "block";
    }
}


/* =====================================================
   SCREEN SHAKE
===================================================== */

function updateScreenShake() {

    screenShake *= 0.88;

    if (
        screenShake < 0.1
    ) {

        screenShake = 0;
    }
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    if (!gameRunning) {

        /*
           We still draw the final
           explosion/wreck state.
        */

        drawEverything();

        return;
    }


    movePlayer();

    aimPlayer();

    updateEnemies();

    updateShells();

    updateImpacts();

    updateExplosions();

    updateSmoke();

    updateFireParticles();

    updateMuzzleFlashes();

    updateTrackMarks();

    updateHitTexts();


    createTankSmoke(
        player
    );

    enemies.forEach(
        function(enemy) {

            createTankSmoke(
                enemy
            );
        }
    );


    drawEverything();

    updateUI();

    checkGameState();

    updateScreenShake();


    if (gameRunning) {

        requestAnimationFrame(
            gameLoop
        );
    }
}


/* =====================================================
   DRAW EVERYTHING
===================================================== */

function drawEverything() {

    ctx.save();


    /*
       SCREEN SHAKE
    */

    if (
        screenShake > 0
    ) {

        ctx.translate(
            (Math.random() - 0.5) *
            screenShake,

            (Math.random() - 0.5) *
            screenShake
        );
    }


    /*
       MAP
    */

    drawMap();


    /*
       TRACKS
    */

    drawTrackMarks();


    /*
       WRECKS
    */

    drawWrecks();


    /*
       SHELLS
    */

    drawShells();


    /*
       IMPACTS
    */

    drawImpacts();


    /*
       TANKS
    */

    enemies.forEach(
        function(enemy) {

            drawTank(
                enemy
            );
        }
    );


    if (
        player &&
        !player.destroyed
    ) {

        drawTank(
            player
        );
    }


    /*
       FIRE
    */

    drawFireParticles();


    /*
       SMOKE
    */

    drawSmoke();


    /*
       EXPLOSIONS
    */

    drawExplosions();


    /*
       MUZZLE FLASH
    */

    drawMuzzleFlashes();


    /*
       HIT TEXT
    */

    drawHitTexts();


    ctx.restore();
}

</script>
