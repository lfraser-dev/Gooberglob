<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gooberglob Tank Battle</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: 0 auto;
        background: #333;
        border: 3px solid #555;
        cursor: crosshair;
    }

    #menu {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(circle at center, #333 0%, #171717 55%, #080808 100%);
        z-index: 10;
    }

    .panel {
        width: 620px;
        max-width: 92%;
        background: rgba(15,15,15,0.96);
        border: 3px solid #777;
        border-radius: 12px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    h1 {
        margin-top: 0;
        font-size: 42px;
        letter-spacing: 3px;
        color: #ddd;
        text-shadow: 3px 3px #000;
    }

    h2 {
        color: #ccc;
    }

    .choice-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 15px 0 25px;
    }

    button {
        background: #292929;
        color: white;
        border: 2px solid #666;
        padding: 12px 18px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.15s;
    }

    button:hover {
        background: #444;
        transform: translateY(-2px);
    }

    button.selected {
        background: #666;
        border-color: white;
    }

    #startButton {
        margin-top: 15px;
        padding: 15px 35px;
        font-size: 20px;
        font-weight: bold;
        background: #384c30;
        border-color: #8da17e;
    }

    #hud {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 1060px;
        max-width: 95%;
        z-index: 5;
        pointer-events: none;
        display: none;
    }

    .hud-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
    }

    .hud-box {
        background: rgba(0,0,0,0.65);
        border: 2px solid #777;
        border-radius: 6px;
        padding: 8px 12px;
        min-width: 230px;
    }

    .health-bar {
        width: 200px;
        height: 15px;
        background: #222;
        border: 1px solid #888;
        margin-top: 5px;
    }

    .health-fill {
        height: 100%;
        width: 100%;
        background: #57a957;
        transition: width 0.1s;
    }

    #message {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
        pointer-events: none;
    }

    #messageBox {
        background: rgba(0,0,0,0.88);
        border: 3px solid #aaa;
        border-radius: 12px;
        padding: 35px 55px;
        text-align: center;
        box-shadow: 0 0 50px #000;
    }

    #messageBox h1 {
        margin-bottom: 10px;
    }

    #restartButton {
        pointer-events: auto;
        margin-top: 15px;
    }

    .controls {
        color: #aaa;
        font-size: 14px;
        line-height: 1.6;
    }
</style>
</head>

<body>

<div id="menu">
    <div class="panel">
        <h1>GOOBERGLOB</h1>
        <h2>TANK BATTLE</h2>

        <div>
            <strong>Choose Faction</strong>
            <div class="choice-row" id="factionChoices"></div>
        </div>

        <div>
            <strong>Choose Tank</strong>
            <div class="choice-row" id="tankChoices"></div>
        </div>

        <div>
            <strong>Choose Map</strong>
            <div class="choice-row" id="mapChoices"></div>
        </div>

        <button id="startButton">START BATTLE</button>

        <div class="controls">
            <br>
            WASD = Move<br>
            Mouse = Aim Turret<br>
            Left Click / SPACE = Fire
        </div>
    </div>
</div>

<canvas id="gameCanvas" width="1100" height="700"></canvas>

<div id="hud">
    <div class="hud-row">
        <div class="hud-box">
            <div id="playerName">PLAYER</div>
            <div class="health-bar">
                <div id="playerHealth" class="health-fill"></div>
            </div>
        </div>

        <div class="hud-box" style="text-align:center;">
            <div id="mapName">MAP</div>
            <div id="enemyCount">Enemies: 0</div>
        </div>

        <div class="hud-box" style="text-align:right;">
            <div id="enemyName">ENEMY</div>
            <div class="health-bar">
                <div id="enemyHealth" class="health-fill"></div>
            </div>
        </div>
    </div>
</div>

<div id="message">
    <div id="messageBox">
        <h1 id="messageTitle">GAME OVER</h1>
        <p id="messageText"></p>
        <button id="restartButton">RETURN TO MENU</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let gameRunning = false;
let gameOver = false;
let resultShown = false;

let selectedFaction = "British";
let selectedTank = "Cromwell";
let selectedMap = "Trench Front";

let player = null;
let enemies = [];
let shells = [];
let particles = [];
let smokeParticles = [];
let explosions = [];
let wrecks = [];
let trackMarks = [];

let keys = {};
let mouse = {
    x: W / 2,
    y: H / 2,
    down: false
};

let lastTime = performance.now();
let screenShake = 0;

const factions = {
    "British": {
        enemy: "German",
        tanks: {
            "Tetrarch": {
                class: "light",
                speed: 2.9,
                health: 100,
                damage: 24,
                reload: 650,
                armor: 0.75,
                size: 27
            },
            "Cromwell": {
                class: "medium",
                speed: 2.15,
                health: 150,
                damage: 32,
                reload: 800,
                armor: 1,
                size: 31
            },
            "Churchill": {
                class: "heavy",
                speed: 1.35,
                health: 230,
                damage: 48,
                reload: 1100,
                armor: 1.35,
                size: 35
            }
        }
    },

    "German": {
        enemy: "Soviet Union",
        tanks: {
            "Panzer II": {
                class: "light",
                speed: 2.75,
                health: 95,
                damage: 22,
                reload: 600,
                armor: 0.7,
                size: 26
            },
            "Panzer IV": {
                class: "medium",
                speed: 2.05,
                health: 155,
                damage: 34,
                reload: 800,
                armor: 1.05,
                size: 31
            },
            "Tiger I": {
                class: "heavy",
                speed: 1.25,
                health: 250,
                damage: 52,
                reload: 1150,
                armor: 1.45,
                size: 36
            }
        }
    },

    "Soviet Union": {
        enemy: "British",
        tanks: {
            "T-70": {
                class: "light",
                speed: 2.85,
                health: 105,
                damage: 25,
                reload: 650,
                armor: 0.8,
                size: 27
            },
            "T-34": {
                class: "medium",
                speed: 2.2,
                health: 165,
                damage: 35,
                reload: 780,
                armor: 1.05,
                size: 32
            },
            "IS-2": {
                class: "heavy",
                speed: 1.3,
                health: 255,
                damage: 55,
                reload: 1200,
                armor: 1.5,
                size: 37
            }
        }
    }
};

const maps = [
    "Trench Front",
    "Ruined Town",
    "Snowy Forest"
];

let obstacles = [];

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}

function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
}

function angleDifference(a, b) {
    return Math.abs(normalizeAngle(a - b));
}

function circleRectCollision(x, y, radius, rect) {
    const closestX = clamp(x, rect.x, rect.x + rect.w);
    const closestY = clamp(y, rect.y, rect.y + rect.h);

    const dx = x - closestX;
    const dy = y - closestY;

    return dx * dx + dy * dy < radius * radius;
}

function tankBlocked(tank, x, y) {
    if (
        x - tank.radius < 10 ||
        x + tank.radius > W - 10 ||
        y - tank.radius < 10 ||
        y + tank.radius > H - 10
    ) {
        return true;
    }

    for (const rect of obstacles) {
        if (circleRectCollision(x, y, tank.radius, rect)) {
            return true;
        }
    }

    return false;
}

function lineBlocked(x1, y1, x2, y2) {
    const steps = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 8);

    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = x1 + (x2 - x1) * t;
        const y = y1 + (y2 - y1) * t;

        for (const rect of obstacles) {
            if (
                x >= rect.x &&
                x <= rect.x + rect.w &&
                y >= rect.y &&
                y <= rect.y + rect.h
            ) {
                return true;
            }
        }
    }

    return false;
}

/* ---------------- MENU ---------------- */

function setupMenu() {
    const factionChoices = document.getElementById("factionChoices");
    const tankChoices = document.getElementById("tankChoices");
    const mapChoices = document.getElementById("mapChoices");

    factionChoices.innerHTML = "";
    tankChoices.innerHTML = "";
    mapChoices.innerHTML = "";

    Object.keys(factions).forEach(faction => {
        const button = document.createElement("button");
        button.textContent = faction;

        if (faction === selectedFaction) {
            button.classList.add("selected");
        }

        button.onclick = () => {
            selectedFaction = faction;
            selectedTank = Object.keys(factions[faction].tanks)[1];
            setupMenu();
        };

        factionChoices.appendChild(button);
    });

    Object.keys(factions[selectedFaction].tanks).forEach(tankName => {
        const button = document.createElement("button");
        const tank = factions[selectedFaction].tanks[tankName];

        button.innerHTML = `${tankName}<br><small>${tank.class}</small>`;

        if (tankName === selectedTank) {
            button.classList.add("selected");
        }

        button.onclick = () => {
            selectedTank = tankName;
            setupMenu();
        };

        tankChoices.appendChild(button);
    });

    maps.forEach(map => {
        const button = document.createElement("button");
        button.textContent = map;

        if (map === selectedMap) {
            button.classList.add("selected");
        }

        button.onclick = () => {
            selectedMap = map;
            setupMenu();
        };

        mapChoices.appendChild(button);
    });
}

document.getElementById("startButton").onclick = startGame;

document.getElementById("restartButton").onclick = () => {
    document.getElementById("message").style.display = "none";
    document.getElementById("menu").style.display = "flex";

    gameRunning = false;
    gameOver = false;
    resultShown = false;

    setupMenu();
};

setupMenu();

/* ---------------- MAPS ---------------- */

function drawMap() {
    if (selectedMap === "Trench Front") {
        ctx.fillStyle = "#625b42";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#4c4733";

        for (let y = 80; y < H; y += 115) {
            ctx.fillRect(0, y, W, 35);
        }

        ctx.strokeStyle = "#807755";
        ctx.lineWidth = 3;

        for (let y = 20; y < H; y += 115) {
            ctx.beginPath();
            ctx.moveTo(0, y + 60);
            ctx.lineTo(W, y + 60);
            ctx.stroke();
        }
    }

    if (selectedMap === "Ruined Town") {
        ctx.fillStyle = "#696969";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#494949";

        for (let x = 0; x < W; x += 110) {
            ctx.fillRect(x, 0, 7, H);
        }

        for (let y = 0; y < H; y += 110) {
            ctx.fillRect(0, y, W, 7);
        }

        ctx.fillStyle = "#353535";

        for (const rect of obstacles) {
            ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        }
    }

    if (selectedMap === "Snowy Forest") {
        ctx.fillStyle = "#d7d9d8";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#c3c7c6";

        for (let i = 0; i < 120; i++) {
            const x = (i * 97) % W;
            const y = (i * 53) % H;

            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = "#5e4b38";

        for (const rect of obstacles) {
            ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        }

        // Trees
        for (let i = 0; i < 45; i++) {
            const x = (i * 137) % W;
            const y = (i * 79) % H;

            let blocked = false;

            for (const rect of obstacles) {
                if (
                    x > rect.x - 20 &&
                    x < rect.x + rect.w + 20 &&
                    y > rect.y - 20 &&
                    y < rect.y + rect.h + 20
                ) {
                    blocked = true;
                }
            }

            if (!blocked) {
                ctx.fillStyle = "#304636";
                ctx.beginPath();
                ctx.moveTo(x, y - 22);
                ctx.lineTo(x - 15, y + 12);
                ctx.lineTo(x + 15, y + 12);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#554331";
                ctx.fillRect(x - 3, y + 10, 6, 15);
            }
        }
    }
}

function createMap() {
    obstacles = [];

    if (selectedMap === "Ruined Town") {
        obstacles = [
            {x: 100, y: 90, w: 145, h: 80},
            {x: 400, y: 70, w: 130, h: 100},
            {x: 760, y: 100, w: 180, h: 75},
            {x: 180, y: 350, w: 170, h: 90},
            {x: 470, y: 330, w: 130, h: 115},
            {x: 760, y: 390, w: 180, h: 90},
            {x: 80, y: 570, w: 170, h: 65},
            {x: 500, y: 550, w: 170, h: 75},
            {x: 830, y: 570, w: 150, h: 70}
        ];
    }

    if (selectedMap === "Snowy Forest") {
        obstacles = [
            {x: 150, y: 100, w: 120, h: 75},
            {x: 450, y: 120, w: 140, h: 80},
            {x: 780, y: 90, w: 130, h: 80},
            {x: 250, y: 400, w: 120, h: 80},
            {x: 580, y: 360, w: 150, h: 85},
            {x: 850, y: 430, w: 130, h: 75}
        ];
    }
}

/* ---------------- TANKS ---------------- */

function createTank(name, faction, x, y, isPlayer = false) {
    const data = factions[faction].tanks[name];

    return {
        name,
        faction,
        class: data.class,

        x,
        y,

        radius: data.size,

        speed: data.speed,
        maxHealth: data.health,
        health: data.health,

        damage: data.damage,
        reloadTime: data.reload,
        reload: 0,

        armor: data.armor,

        hullAngle: 0,
        turretAngle: 0,

        isPlayer,

        dead: false,
        destroyed: false,

        smokeLevel: 0,
        burning: false,

        fireTimer: 0,

        lastX: x,
        lastY: y,

        aiTimer: 0,
        aiState: "attack",
        aiDirection: Math.random() < 0.5 ? -1 : 1
    };
}

function drawTank(tank) {
    if (tank.destroyed) return;

    ctx.save();
    ctx.translate(tank.x, tank.y);

    ctx.rotate(tank.hullAngle);

    drawTankHull(tank);

    ctx.restore();

    drawTurret(tank);
    drawTankEffects(tank);
}

function getTankColor(tank) {
    if (tank.faction === "British") return "#657f50";
    if (tank.faction === "German") return "#776e53";
    return "#54734d";
}

function drawTankHull(tank) {
    const s = tank.radius;

    // tracks
    ctx.fillStyle = "#202020";

    ctx.fillRect(-s - 5, -s * 0.65, 9, s * 1.3);
    ctx.fillRect(s - 4, -s * 0.65, 9, s * 1.3);

    // track highlights
    ctx.fillStyle = "#444";

    for (let y = -s * 0.5; y < s * 0.6; y += 8) {
        ctx.fillRect(-s - 4, y, 7, 4);
        ctx.fillRect(s - 3, y, 7, 4);
    }

    // hull
    ctx.fillStyle = getTankColor(tank);
    ctx.fillRect(-s * 0.72, -s * 0.62, s * 1.44, s * 1.24);

    // front plate
    ctx.fillStyle = "#8b956b";
    ctx.fillRect(s * 0.38, -s * 0.58, s * 0.35, s * 1.16);

    // hatch
    ctx.fillStyle = "#363b2c";
    ctx.beginPath();
    ctx.arc(-s * 0.15, 0, s * 0.2, 0, Math.PI * 2);
    ctx.fill();

    // damage marks
    if (tank.health < tank.maxHealth * 0.6) {
        ctx.strokeStyle = "#25251f";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(-s * 0.45, -s * 0.3);
        ctx.lineTo(-s * 0.1, s * 0.05);
        ctx.moveTo(s * 0.1, s * 0.4);
        ctx.lineTo(s * 0.4, s * 0.1);
        ctx.stroke();
    }
}

function drawTurret(tank) {
    ctx.save();

    ctx.translate(tank.x, tank.y);
    ctx.rotate(tank.turretAngle);

    const s = tank.radius;

    ctx.fillStyle = "#272b22";
    ctx.fillRect(0, -4, s + 15, 8);

    ctx.fillStyle = getTankColor(tank);

    ctx.beginPath();
    ctx.arc(0, 0, s * 0.52, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#31362a";

    ctx.beginPath();
    ctx.arc(-s * 0.05, 0, s * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawTankEffects(tank) {
    if (tank.smokeLevel > 0) {
        for (let i = 0; i < Math.ceil(tank.smokeLevel); i++) {
            const x = tank.x + (Math.random() - 0.5) * tank.radius;
            const y = tank.y - tank.radius * 0.8 - Math.random() * 10;

            ctx.fillStyle = `rgba(45,45,45,${0.12 + tank.smokeLevel * 0.04})`;

            ctx.beginPath();
            ctx.arc(x, y, 5 + Math.random() * 5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    if (tank.burning) {
        ctx.fillStyle = "#ff8c00";

        ctx.beginPath();
        ctx.arc(
            tank.x + (Math.random() - 0.5) * 15,
            tank.y - 5,
            8 + Math.random() * 5,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ffe66d";

        ctx.beginPath();
        ctx.arc(
            tank.x + (Math.random() - 0.5) * 10,
            tank.y - 10,
            4 + Math.random() * 3,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }
}

/* ---------------- TRACK MARKS ---------------- */

function updateTrackMarks(tank) {
    if (tank.destroyed) return;

    const moved = Math.hypot(
        tank.x - tank.lastX,
        tank.y - tank.lastY
    );

    if (moved > 2) {
        trackMarks.push({
            x: tank.x,
            y: tank.y,
            angle: tank.hullAngle,
            life: 1
        });

        tank.lastX = tank.x;
        tank.lastY = tank.y;
    }
}

function updateTrackMarks() {
    for (const mark of trackMarks) {
        mark.life -= 0.0007;
    }

    trackMarks = trackMarks.filter(m => m.life > 0);
}

function drawTrackMarks() {
    for (const mark of trackMarks) {
        ctx.save();

        ctx.translate(mark.x, mark.y);
        ctx.rotate(mark.angle);

        ctx.globalAlpha = mark.life * 0.35;
        ctx.fillStyle = "#24231f";

        ctx.fillRect(-15, -11, 5, 22);
        ctx.fillRect(10, -11, 5, 22);

        ctx.restore();
    }

    ctx.globalAlpha = 1;
}

/* ---------------- SHELLS ---------------- */

function fireShell(tank) {
    if (tank.destroyed || tank.reload > 0) return;

    tank.reload = tank.reloadTime;

    const angle = tank.turretAngle;

    const startDistance = tank.radius + 17;

    shells.push({
        x: tank.x + Math.cos(angle) * startDistance,
        y: tank.y + Math.sin(angle) * startDistance,

        vx: Math.cos(angle) * 8,
        vy: Math.sin(angle) * 8,

        owner: tank,

        damage: tank.damage,

        life: 130,

        trail: []
    });

    // muzzle flash
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: tank.x + Math.cos(angle) * (tank.radius + 12),
            y: tank.y + Math.sin(angle) * (tank.radius + 12),
            vx: Math.cos(angle) * (Math.random() * 3 + 1),
            vy: Math.sin(angle) * (Math.random() * 3 + 1),
            life: 12 + Math.random() * 8,
            maxLife: 20,
            size: 2 + Math.random() * 4,
            type: "flash"
        });
    }

    // gun smoke
    for (let i = 0; i < 5; i++) {
        smokeParticles.push({
            x: tank.x + Math.cos(angle) * (tank.radius + 12),
            y: tank.y + Math.sin(angle) * (tank.radius + 12),
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.8,
            life: 20 + Math.random() * 20,
            size: 3 + Math.random() * 4
        });
    }
}

function updateShells() {
    for (const shell of shells) {
        shell.trail.push({
            x: shell.x,
            y: shell.y,
            life: 1
        });

        if (shell.trail.length > 12) {
            shell.trail.shift();
        }

        for (const point of shell.trail) {
            point.life -= 0.08;
        }

        const oldX = shell.x;
        const oldY = shell.y;

        shell.x += shell.vx;
        shell.y += shell.vy;

        shell.life--;

        // building collision
        let hitBuilding = false;

        for (const rect of obstacles) {
            if (
                shell.x >= rect.x &&
                shell.x <= rect.x + rect.w &&
                shell.y >= rect.y &&
                shell.y <= rect.y + rect.h
            ) {
                hitBuilding = true;
                break;
            }
        }

        if (hitBuilding) {
            createImpact(shell.x, shell.y, false);
            shell.life = 0;
            continue;
        }

        // boundary
        if (
            shell.x < 0 ||
            shell.x > W ||
            shell.y < 0 ||
            shell.y > H
        ) {
            shell.life = 0;
            continue;
        }

        const targets = shell.owner.isPlayer ? enemies : [player];

        for (const target of targets) {
            if (!target || target.destroyed) continue;

            if (Math.hypot(shell.x - target.x, shell.y - target.y) <= target.radius) {
                hitTank(shell, target);
                shell.life = 0;
                break;
            }
        }
    }

    shells = shells.filter(shell => shell.life > 0);
}

function drawShells() {
    for (const shell of shells) {
        for (const point of shell.trail) {
            if (point.life <= 0) continue;

            ctx.fillStyle = `rgba(210,210,180,${point.life * 0.25})`;

            ctx.beginPath();
            ctx.arc(point.x, point.y, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = "#e6d59a";

        ctx.beginPath();
        ctx.arc(shell.x, shell.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

/* ---------------- HIT SYSTEM ---------------- */

function getHitLocation(shell, target) {
    /*
       shell travels INTO the tank.

       We compare the shell's travel direction to the tank's hull.

       0°     = front
       180°   = rear
       90°    = side
    */

    const incomingAngle = Math.atan2(shell.vy, shell.vx);

    const frontAngle = target.hullAngle;

    const difference = angleDifference(
        incomingAngle,
        frontAngle
    );

    if (difference < Math.PI / 4) {
        return "front";
    }

    if (difference > Math.PI * 3 / 4) {
        return "rear";
    }

    return "side";
}

function getArmorMultiplier(target, location) {
    let multiplier = target.armor;

    if (location === "front") {
        multiplier *= 0.65;
    }

    if (location === "side") {
        multiplier *= 1.0;
    }

    if (location === "rear") {
        multiplier *= 1.35;
    }

    return multiplier;
}

function hitTank(shell, target) {
    if (target.destroyed) return;

    const location = getHitLocation(shell, target);

    const armorMultiplier = getArmorMultiplier(
        target,
        location
    );

    let damage = shell.damage / armorMultiplier;

    /*
       Glancing only at extreme impact angles.
       Most hits therefore deal normal damage.
    */

    const impactAngle = Math.abs(
        normalizeAngle(
            Math.atan2(shell.vy, shell.vx) -
            target.hullAngle
        )
    );

    let glancing = false;

    if (
        impactAngle > Math.PI * 0.72 &&
        impactAngle < Math.PI * 1.28
    ) {
        glancing = true;
        damage *= 0.35;
    }

    // light randomisation, but never enough to make every hit weak
    damage *= 0.9 + Math.random() * 0.2;

    target.health -= damage;

    // damage-based smoke
    target.smokeLevel = Math.max(
        target.smokeLevel,
        target.health < target.maxHealth * 0.35 ? 2.5 : 0.8
    );

    createImpact(target.x, target.y, true);

    if (location === "front") {
        createFloatingText(
            target.x,
            target.y - target.radius - 12,
            glancing ? "GLANCE" : "FRONT",
            glancing ? "#aaa" : "#fff"
        );
    }

    if (location === "side") {
        createFloatingText(
            target.x,
            target.y - target.radius - 12,
            glancing ? "GLANCE" : "SIDE",
            glancing ? "#aaa" : "#ffd36b"
        );
    }

    if (location === "rear") {
        createFloatingText(
            target.x,
            target.y - target.radius - 12,
            glancing ? "GLANCE" : "REAR HIT!",
            glancing ? "#aaa" : "#ff765c"
        );
    }

    if (target.health <= target.maxHealth * 0.25 && !target.burning) {
        target.burning = true;
        target.fireTimer = 0;

        createExplosion(
            target.x,
            target.y,
            18,
            false
        );
    }

    if (target.health <= 0) {
        destroyTank(target);
    }
}

function createImpact(x, y, tankHit) {
    for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 15 + Math.random() * 15,
            maxLife: 30,
            size: 2 + Math.random() * 3,
            type: tankHit ? "spark" : "dust"
        });
    }

    screenShake = Math.max(screenShake, tankHit ? 5 : 2);
}

/* ---------------- DAMAGE / FIRE ---------------- */

function updateTankDamageEffects(tank) {
    if (tank.destroyed) return;

    // smoke is based on damage, but it fades naturally
    const damagePercent =
        1 - tank.health / tank.maxHealth;

    if (damagePercent > 0.35) {
        tank.smokeLevel = Math.max(
            tank.smokeLevel,
            Math.min(2, damagePercent * 3)
        );
    } else {
        tank.smokeLevel *= 0.985;
    }

    // critical fire
    if (tank.burning) {
        tank.fireTimer++;

        if (tank.fireTimer % 45 === 0) {
            tank.health -= 1.5;

            if (tank.health <= 0) {
                destroyTank(tank);
                return;
            }
        }

        if (Math.random() < 0.08) {
            smokeParticles.push({
                x: tank.x + (Math.random() - 0.5) * 15,
                y: tank.y - tank.radius,
                vx: (Math.random() - 0.5) * 0.5,
                vy: -Math.random() * 0.8,
                life: 40 + Math.random() * 30,
                size: 5 + Math.random() * 5
            });
        }
    }
}

/* ---------------- EXPLOSIONS ---------------- */

function createExplosion(x, y, power = 25, huge = true) {
    explosions.push({
        x,
        y,
        radius: 2,
        maxRadius: power,
        life: huge ? 55 : 35,
        maxLife: huge ? 55 : 35,
        huge
    });

    const count = huge ? 65 : 25;

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * (huge ? 6 : 3) + 1;

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.random() * 45,
            maxLife: 65,
            size: 2 + Math.random() * (huge ? 7 : 4),
            type: i % 3 === 0 ? "smoke" : "fire"
        });
    }

    for (let i = 0; i < (huge ? 20 : 7); i++) {
        smokeParticles.push({
            x: x + (Math.random() - 0.5) * 20,
            y: y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 1,
            vy: -Math.random() * 1.2,
            life: 50 + Math.random() * 50,
            size: 5 + Math.random() * 10
        });
    }

    screenShake = Math.max(
        screenShake,
        huge ? 18 : 8
    );
}

function destroyTank(tank) {
    if (tank.destroyed) return;

    tank.destroyed = true;
    tank.dead = true;
    tank.health = 0;

    wrecks.push({
        x: tank.x,
        y: tank.y,
        angle: tank.hullAngle,
        radius: tank.radius,
        faction: tank.faction
    });

    createExplosion(
        tank.x,
        tank.y,
        tank.radius * 2.5,
        true
    );
}

function updateExplosions() {
    for (const explosion of explosions) {
        explosion.life--;

        const progress =
            1 - explosion.life / explosion.maxLife;

        explosion.radius =
            explosion.maxRadius *
            Math.sin(Math.min(progress, 1) * Math.PI / 2);
    }

    explosions = explosions.filter(
        explosion => explosion.life > 0
    );
}

function drawExplosions() {
    for (const explosion of explosions) {
        const alpha =
            explosion.life / explosion.maxLife;

        ctx.globalAlpha = alpha;

        ctx.fillStyle = "#ff8c00";

        ctx.beginPath();
        ctx.arc(
            explosion.x,
            explosion.y,
            explosion.radius,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ffe8a3";

        ctx.beginPath();
        ctx.arc(
            explosion.x,
            explosion.y,
            explosion.radius * 0.5,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.globalAlpha = 1;
    }
}

/* ---------------- PARTICLES ---------------- */

function updateParticles() {
    for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.97;
        p.vy *= 0.97;

        p.life--;
    }

    particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;

        ctx.globalAlpha = alpha;

        if (p.type === "spark") {
            ctx.fillStyle = "#ffd86b";
        } else if (p.type === "fire") {
            ctx.fillStyle = "#ff7b22";
        } else if (p.type === "flash") {
            ctx.fillStyle = "#fff3ad";
        } else if (p.type === "smoke") {
            ctx.fillStyle = "#555";
        } else {
            ctx.fillStyle = "#777";
        }

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.size * alpha,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

function updateSmoke() {
    for (const s of smokeParticles) {
        s.x += s.vx;
        s.y += s.vy;

        s.vx *= 0.98;
        s.vy *= 0.98;

        s.life--;
        s.size += 0.04;
    }

    smokeParticles = smokeParticles.filter(
        s => s.life > 0
    );
}

function drawSmoke() {
    for (const s of smokeParticles) {
        ctx.globalAlpha =
            Math.min(0.35, s.life / 120);

        ctx.fillStyle = "#4a4a4a";

        ctx.beginPath();
        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* ---------------- FLOATING TEXT ---------------- */

let floatingTexts = [];

function createFloatingText(x, y, text, color) {
    floatingTexts.push({
        x,
        y,
        text,
        color,
        life: 45
    });
}

function updateFloatingText() {
    for (const t of floatingTexts) {
        t.y -= 0.5;
        t.life--;
    }

    floatingTexts =
        floatingTexts.filter(t => t.life > 0);
}

function drawFloatingText() {
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";

    for (const t of floatingTexts) {
        ctx.globalAlpha = t.life / 45;
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    }

    ctx.globalAlpha = 1;
}

/* ---------------- WRECKS ---------------- */

function drawWrecks() {
    for (const wreck of wrecks) {
        ctx.save();

        ctx.translate(wreck.x, wreck.y);
        ctx.rotate(wreck.angle);

        ctx.fillStyle = "#181818";

        ctx.fillRect(
            -wreck.radius,
            -wreck.radius * 0.6,
            wreck.radius * 2,
            wreck.radius * 1.2
        );

        ctx.fillStyle = "#303030";

        ctx.fillRect(
            -wreck.radius * 0.5,
            -wreck.radius * 0.3,
            wreck.radius,
            wreck.radius * 0.6
        );

        ctx.restore();
    }
}

/* ---------------- PLAYER ---------------- */

function updatePlayer() {
    if (!player || player.destroyed) return;

    let dx = 0;
    let dy = 0;

    if (keys["w"]) dy -= 1;
    if (keys["s"]) dy += 1;
    if (keys["a"]) dx -= 1;
    if (keys["d"]) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy);

        dx /= length;
        dy /= length;

        const newX =
            player.x + dx * player.speed;

        const newY =
            player.y + dy * player.speed;

        if (!tankBlocked(player, newX, player.y)) {
            player.x = newX;
        }

        if (!tankBlocked(player, player.x, newY)) {
            player.y = newY;
        }

        player.hullAngle = Math.atan2(dy, dx);

        updateTrackMarks(player);
    }

    player.turretAngle =
        Math.atan2(
            mouse.y - player.y,
            mouse.x - player.x
        );

    if (mouse.down || keys[" "]) {
        fireShell(player);
    }
}

/* ---------------- ENEMIES ---------------- */

function moveEnemy(enemy, dx, dy) {
    const length = Math.hypot(dx, dy);

    if (length < 0.01) return;

    dx /= length;
    dy /= length;

    const speed = enemy.speed;

    // Try direct movement
    const directX = enemy.x + dx * speed;
    const directY = enemy.y + dy * speed;

    if (!tankBlocked(enemy, directX, directY)) {
        enemy.x = directX;
        enemy.y = directY;
        enemy.hullAngle = Math.atan2(dy, dx);
        updateTrackMarks(enemy);
        return;
    }

    /*
       Simple obstacle avoidance.

       If the direct route is blocked, try several
       angled routes. This stops tanks constantly
       driving face-first into buildings.
    */

    const baseAngle = Math.atan2(dy, dx);

    const alternatives = [
        baseAngle + Math.PI / 4,
        baseAngle - Math.PI / 4,
        baseAngle + Math.PI / 2,
        baseAngle - Math.PI / 2,
        baseAngle + Math.PI * 0.75,
        baseAngle - Math.PI * 0.75
    ];

    for (const angle of alternatives) {
        const testX =
            enemy.x + Math.cos(angle) * speed;

        const testY =
            enemy.y + Math.sin(angle) * speed;

        if (!tankBlocked(enemy, testX, testY)) {
            enemy.x = testX;
            enemy.y = testY;
            enemy.hullAngle = angle;
            updateTrackMarks(enemy);
            return;
        }
    }
}

function enemyCanShoot(enemy) {
    if (!player || player.destroyed) return false;

    return !lineBlocked(
        enemy.x,
        enemy.y,
        player.x,
        player.y
    );
}

function updateEnemy(enemy) {
    if (enemy.destroyed) return;

    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;

    const dist = Math.hypot(dx, dy);

    enemy.turretAngle =
        Math.atan2(dy, dx);

    enemy.aiTimer--;

    /*
       LIGHT TANK
       Fast, aggressive flanking, retreats
       when badly damaged.
    */

    if (enemy.class === "light") {
        if (enemy.health < enemy.maxHealth * 0.35) {
            enemy.aiState = "retreat";

            moveEnemy(
                enemy,
                -dx,
                -dy
            );
        } else {
            enemy.aiState = "flank";

            const angle =
                Math.atan2(dy, dx) +
                enemy.aiDirection * Math.PI / 2;

            const desiredDistance = 330;

            const targetX =
                player.x +
                Math.cos(angle) * desiredDistance;

            const targetY =
                player.y +
                Math.sin(angle) * desiredDistance;

            moveEnemy(
                enemy,
                targetX - enemy.x,
                targetY - enemy.y
            );

            if (enemy.aiTimer <= 0) {
                enemy.aiTimer = 100 + Math.random() * 100;

                if (Math.random() < 0.35) {
                    enemy.aiDirection *= -1;
                }
            }
        }
    }

    /*
       MEDIUM TANK
       Keeps medium range and tries to push
       while avoiding getting too close.
    */

    if (enemy.class === "medium") {
        enemy.aiState = "push";

        if (dist > 430) {
            moveEnemy(enemy, dx, dy);
        } else if (dist < 260) {
            moveEnemy(enemy, -dx, -dy);
        } else {
            // strafe while fighting
            const angle =
                Math.atan2(dy, dx) +
                enemy.aiDirection * Math.PI / 2;

            moveEnemy(
                enemy,
                Math.cos(angle),
                Math.sin(angle)
            );
        }

        if (enemy.aiTimer <= 0) {
            enemy.aiTimer = 120 + Math.random() * 100;

            if (Math.random() < 0.3) {
                enemy.aiDirection *= -1;
            }
        }
    }

    /*
       HEAVY TANK
       Slowly closes distance and doesn't
       retreat just because it gets hit.
    */

    if (enemy.class === "heavy") {
        enemy.aiState = "attack";

        if (dist > 280) {
            moveEnemy(enemy, dx, dy);
        } else if (dist < 180) {
            moveEnemy(enemy, -dx, -dy);
        } else {
            // slight movement while aiming
            const angle =
                Math.atan2(dy, dx) +
                Math.sin(Date.now() / 1000) * 0.3;

            moveEnemy(
                enemy,
                Math.cos(angle),
                Math.sin(angle)
            );
        }
    }

    if (
        enemy.reload <= 0 &&
        dist < 650 &&
        enemyCanShoot(enemy)
    ) {
        // class-based accuracy
        let aimOffset = 0;

        if (enemy.class === "light") {
            aimOffset =
                (Math.random() - 0.5) * 0.18;
        }

        if (enemy.class === "medium") {
            aimOffset =
                (Math.random() - 0.5) * 0.09;
        }

        if (enemy.class === "heavy") {
            aimOffset =
                (Math.random() - 0.5) * 0.04;
        }

        enemy.turretAngle += aimOffset;

        fireShell(enemy);
    }

    updateTrackMarks(enemy);
}

/* ---------------- GAME STATE ---------------- */

function startGame() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("hud").style.display = "block";

    gameRunning = true;
    gameOver = false;
    resultShown = false;

    shells = [];
    particles = [];
    smokeParticles = [];
    explosions = [];
    wrecks = [];
    trackMarks = [];
    floatingTexts = [];

    createMap();

    player = createTank(
        selectedTank,
        selectedFaction,
        120,
        H / 2,
        true
    );

    player.hullAngle = 0;
    player.turretAngle = 0;

    const enemyFaction =
        factions[selectedFaction].enemy;

    const enemyNames =
        Object.keys(factions[enemyFaction].tanks);

    enemies = [
        createTank(
            enemyNames[0],
            enemyFaction,
            W - 150,
            150
        ),

        createTank(
            enemyNames[1],
            enemyFaction,
            W - 150,
            H / 2
        ),

        createTank(
            enemyNames[2],
            enemyFaction,
            W - 150,
            H - 150
        )
    ];

    // Make sure enemies aren't inside buildings
    for (const enemy of enemies) {
        let attempts = 0;

        while (
            tankBlocked(
                enemy,
                enemy.x,
                enemy.y
            ) &&
            attempts < 100
        ) {
            enemy.x =
                W - 100 - Math.random() * 120;

            enemy.y =
                80 + Math.random() * (H - 160);

            attempts++;
        }
    }

    updateHUD();
}

function updateHUD() {
    if (!player) return;

    document.getElementById("playerName").textContent =
        `${player.faction} ${player.name}`;

    document.getElementById("playerHealth").style.width =
        `${Math.max(0, player.health / player.maxHealth * 100)}%`;

    const aliveEnemies =
        enemies.filter(e => !e.destroyed).length;

    document.getElementById("enemyCount").textContent =
        `Enemies: ${aliveEnemies}`;

    document.getElementById("mapName").textContent =
        selectedMap;
}

/* ---------------- GAME LOOP ---------------- */

function update(dt) {
    /*
       IMPORTANT:
       The update loop continues even after death.

       That is what allows the explosion,
       smoke and wreck animation to finish.
    */

    if (!gameOver) {
        if (player && !player.destroyed) {
            updatePlayer();
        }

        for (const enemy of enemies) {
            updateEnemy(enemy);
        }

        for (const tank of [player, ...enemies]) {
            if (tank) {
                if (tank.reload > 0) {
                    tank.reload -= dt;
                }

                updateTankDamageEffects(tank);
            }
        }

        updateShells();

        if (player && player.destroyed && !gameOver) {
            gameOver = true;
        }

        if (
            player &&
            !player.destroyed &&
            enemies.every(enemy => enemy.destroyed)
        ) {
            gameOver = true;
        }
    }

    updateParticles();
    updateSmoke();
    updateExplosions();
    updateTrackMarks();
    updateFloatingText();

    screenShake *= 0.9;

    /*
       Only show the final result AFTER all
       explosions have finished.
    */

    if (
        gameOver &&
        !resultShown &&
        explosions.length === 0 &&
        particles.length === 0
    ) {
        showResult();
    }

    updateHUD();
}

function drawEverything() {
    ctx.save();

    // Screen shake
    if (screenShake > 0.1) {
        ctx.translate(
            (Math.random() - 0.5) * screenShake,
            (Math.random() - 0.5) * screenShake
        );
    }

    drawMap();
    drawTrackMarks();
    drawWrecks();
    drawShells();

    if (player) {
        drawTank(player);
    }

    for (const enemy of enemies) {
        drawTank(enemy);
    }

    drawParticles();
    drawSmoke();
    drawExplosions();
    drawFloatingText();

    ctx.restore();
}

function gameLoop(now) {
    const dt = Math.min(
        now - lastTime,
        40
    );

    lastTime = now;

    update(dt);
    drawEverything();

    requestAnimationFrame(gameLoop);
}

/* ---------------- RESULT ---------------- */

function showResult() {
    resultShown = true;

    const title =
        document.getElementById("messageTitle");

    const text =
        document.getElementById("messageText");

    if (player && player.destroyed) {
        title.textContent = "TANK DESTROYED";
        text.textContent =
            "Your tank has been knocked out.";
    } else {
        title.textContent = "VICTORY!";
        text.textContent =
            "All enemy tanks have been destroyed.";
    }

    document.getElementById("message").style.display =
        "flex";
}

/* ---------------- INPUT ---------------- */

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.key === " ") {
        e.preventDefault();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();

    mouse.x =
        (e.clientX - rect.left) *
        (canvas.width / rect.width);

    mouse.y =
        (e.clientY - rect.top) *
        (canvas.height / rect.height);
});

canvas.addEventListener("mousedown", () => {
    mouse.down = true;
});

window.addEventListener("mouseup", () => {
    mouse.down = false;
});

/* ---------------- START ---------------- */

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
