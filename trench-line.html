<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trench Line</title>
<style>html,body{margin:0;height:100%;background:#15140f;overflow:hidden}canvas{display:block;margin:0 auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:crosshair}</style>
</head><body><canvas id="c"></canvas>
<script>
"use strict";
/* ============ TRENCH LINE — a 2D trench-war strategy game (original art & code) ============ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 1280, VH = 720, W = 3000, GY = 548;           // view size, world width, ground line
cv.width = VW; cv.height = VH;
function fit() { const s = Math.min(innerWidth / VW, innerHeight / VH); cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px'; }
addEventListener('resize', fit); fit();

/* ---------- tiny helpers ---------- */
const R = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
function cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- audio (very small, all synthesised) ---------- */
let AC = null, muted = false;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function noise(dur, vol, f0, f1) {
    const a = audio(); if (!a || muted) return; const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = a.createBufferSource(); s.buffer = b; const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(f0, a.currentTime); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), a.currentTime + dur);
    const g = a.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function tone(f0, f1, dur, vol, type) {
    const a = audio(); if (!a || muted) return; const o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, a.currentTime); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
const SND = {
    rifle: () => noise(.12, .09, 4200, 600), sniper: () => noise(.3, .16, 3000, 200), shotgun: () => noise(.2, .14, 2600, 300), mg: () => noise(.07, .05, 4800, 900),
    flame: () => noise(.18, .06, 1600, 300), shell: () => { noise(.35, .22, 1400, 120); tone(90, 40, .3, .12, 'sine'); }, boom: (v) => { noise(.9, .3 * (v || 1), 900, 60); tone(70, 28, .7, .22 * (v || 1), 'sine'); },
    whistle: () => tone(1600, 500, .6, .05, 'sine'), ui: () => tone(640, 880, .08, .06, 'square'), deny: () => tone(200, 140, .12, .06, 'square'), spawn: () => tone(380, 520, .07, .04, 'triangle')
};

/* ---------- unit definitions ---------- */
const T = {
    rifle:   { n: 'RIFLEMAN',      key: '1', cost: 20,  cd: 2.2, hp: 40,  sp: 46, rng: 300, dmg: 9,  rl: 1.15, acc: .78 },
    shotgun: { n: 'SHOTGUNNER',    key: '2', cost: 35,  cd: 3.5, hp: 55,  sp: 52, rng: 125, dmg: 7,  rl: 1.5,  pel: 6 },
    mg:      { n: 'MACHINE GUN',   key: '3', cost: 60,  cd: 6,   hp: 45,  sp: 32, rng: 390, dmg: 5,  rl: .11,  burst: 14, pause: 1.3 },
    sniper:  { n: 'SNIPER',        key: '4', cost: 50,  cd: 5,   hp: 30,  sp: 36, rng: 720, dmg: 44, rl: 2.8 },
    flame:   { n: 'FLAMETHROWER',  key: '5', cost: 75,  cd: 7,   hp: 80,  sp: 40, rng: 135, dps: 38, rl: .05 },
    tank:    { n: 'TANK',          key: '6', cost: 260, cd: 14,  hp: 560, sp: 30, rng: 470, dmg: 78, rl: 2.6, splash: 72, tank: 1 }
};
const ORDER = ['rifle', 'shotgun', 'mg', 'sniper', 'flame', 'tank'];
const COVER = [.62, .46, .32];                                    // damage multiplier inside a trench, by trench level (0..2)
const TRENCH_COST = [150, 320];
const TRENCHES = [560, 960, 1360, 1640, 2040, 2440];            // trench centres (world x)
const BASE_X = [150, W - 150], ZONE = 300;
const ABIL = { mortar: { n: 'MORTAR STRIKE', key: 'Q', cd: 26 }, arty: { n: 'ARTILLERY', key: 'W', cd: 62 } };
const PALETTE = [{ body: '#1e2321', helm: '#6f7d4a', helmD: '#4a5530', sash: '#c9c27c', flag: '#4c7fb8' }, { body: '#2a1413', helm: '#7a3a2e', helmD: '#4e231c', sash: '#d8a43a', flag: '#b8463c' }];

/* ---------- game state ---------- */
let G = null, mx = 0, my = 0, keys = {}, targeting = null, shake = 0, shotT = 0;
const ground = cvs(W, 260), skyC = cvs(VW, VH), hillA = cvs(2048, 300), hillB = cvs(2048, 300);
function newGame() {
    G = { state: 'play', t: 0, cam: 0, units: [], tracers: [], shells: [], fx: [], flames: [], craters: [], markers: [], banner: { t: 0, text: '' },
        money: [110, 110], income: [7, 8], lvl: [0, 0], cap: [0, 0], cd: [{}, {}], abil: [{ mortar: 0, arty: 20 }, { mortar: 8, arty: 40 }], ai: { t: 2, up: 0 },
        stats: { kills: 0, lost: 0, spent: 0 }, bt: [0, 0], nid: 1 };
    ORDER.forEach(k => { G.cd[0][k] = 0; G.cd[1][k] = 0; });
    G.units.push(mk(0, 'rifle', 280), mk(0, 'rifle', 320), mk(1, 'rifle', W - 280), mk(1, 'rifle', W - 320));
    G.cam = 0; targeting = null; say('HOLD THE LINE · CAPTURE THEIR BASE');
}
function say(t) { G.banner = { t: 3.2, text: t }; }

/* ---------- pre-rendered scenery ---------- */
function buildArt() {
    let g = skyC.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, VH * .75);
    [[0, '#7f8fa6'], [.3, '#c6a58c'], [.58, '#f0b57a'], [.8, '#f8d7a0'], [1, '#fbe6b8']].forEach(s => gr.addColorStop(s[0], s[1])); g.fillStyle = gr; g.fillRect(0, 0, VW, VH);
    g.globalCompositeOperation = 'lighter'; const sg = g.createRadialGradient(VW * .72, VH * .5, 0, VW * .72, VH * .5, 380); sg.addColorStop(0, 'rgba(255,230,160,.8)'); sg.addColorStop(.2, 'rgba(255,190,110,.35)'); sg.addColorStop(1, 'rgba(255,150,80,0)'); g.fillStyle = sg; g.fillRect(0, 0, VW, VH); g.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 24; i++) { const x = R(i) * VW, y = 40 + R(i + 9) * 260, w = 160 + R(i + 3) * 280; const cg = g.createRadialGradient(x, y, 0, x, y, w * .5); cg.addColorStop(0, 'rgba(255,226,190,.32)'); cg.addColorStop(1, 'rgba(255,210,170,0)'); g.fillStyle = cg; g.save(); g.translate(x, y); g.scale(1, .22); g.translate(-x, -y); g.beginPath(); g.arc(x, y, w * .5, 0, 7); g.fill(); g.restore(); }
    [[hillA, '#9a8266', 90, 1.2, 0.9], [hillB, '#6e5c45', 70, 3.1, 1.2]].forEach(h => {
        const c = h[0].getContext('2d'), hh = 300; c.fillStyle = h[1]; c.beginPath(); c.moveTo(0, hh);
        for (let x = 0; x <= 2048; x += 16) c.lineTo(x, hh - 60 - h[2] * (Math.sin(x * .004 * h[4] + h[3]) * .5 + .5) - 22 * Math.sin(x * .017 + h[3] * 2)); c.lineTo(2048, hh); c.closePath(); c.fill();
        c.fillStyle = 'rgba(30,22,14,.55)'; for (let i = 0; i < 46; i++) { const x = R(i * 3 + h[3]) * 2048, y = hh - 70 - R(i + h[3]) * 90; c.fillRect(x, y, 2.4, 22 + R(i) * 22); c.fillRect(x - 5, y + 6, 12, 1.5); }
    });
    g = ground.getContext('2d'); const dg = g.createLinearGradient(0, 0, 0, 260); dg.addColorStop(0, '#9c8358'); dg.addColorStop(.08, '#85704a'); dg.addColorStop(1, '#4a3b28'); g.fillStyle = dg; g.fillRect(0, 0, W, 260);
    for (let i = 0; i < 1100; i++) { g.fillStyle = R(i + 4) > .5 ? 'rgba(60,44,28,.22)' : 'rgba(210,184,130,.16)'; g.beginPath(); g.ellipse(R(i) * W, 6 + R(i + 1.3) * 250, 2 + R(i + 2) * 9, 1 + R(i + 3) * 3, 0, 0, 7); g.fill(); }
    g.strokeStyle = 'rgba(40,30,18,.4)'; g.lineWidth = 6; for (let k = 0; k < 2; k++) { g.beginPath(); g.moveTo(0, 28 + k * 10); for (let x = 0; x <= W; x += 40) g.lineTo(x, 28 + k * 10 + Math.sin(x * .02 + k) * 3); g.stroke(); }
    TRENCHES.forEach(tx => { // trench pits
        g.fillStyle = '#2a2016'; g.beginPath(); g.roundRect(tx - 100, 0, 200, 44, [0, 0, 10, 10]); g.fill(); const pg = g.createLinearGradient(0, 0, 0, 44); pg.addColorStop(0, '#3a2c1c'); pg.addColorStop(1, '#171109'); g.fillStyle = pg; g.beginPath(); g.roundRect(tx - 96, 0, 192, 40, [0, 0, 8, 8]); g.fill();
        g.fillStyle = '#6a5030'; for (let p = 0; p < 12; p++) g.fillRect(tx - 92 + p * 16, 32, 14, 6); g.strokeStyle = '#5a4026'; g.lineWidth = 3; [-80, 0, 80].forEach(o => { g.beginPath(); g.moveTo(tx + o, 4); g.lineTo(tx + o, 34); g.stroke(); });
    });
}

/* ---------- units ---------- */
function mk(side, type, x) { const d = T[type]; return { id: G.nid++, side, type, x, y: GY + rnd(-6, 10), hp: d.hp, max: d.hp, cool: rnd(0, d.rl), burst: 0, bp: 0, anim: rnd(0, 6), dead: 0, dt: 0, tgt: null, aim: side ? Math.PI : 0, flash: 0, rec: 0, stopOff: 110 + (G.nid % 7) * 26 }; }
function inTrench(u) { for (const tx of TRENCHES) if (Math.abs(u.x - tx) < 96) return true; return false; }
function coverMul(u) { return u.type === 'tank' ? 1 : (inTrench(u) ? COVER[G.lvl[u.side]] : 1); }
function hurt(u, dmg, src, ap) {
    if (u.dead) return; let d = dmg * coverMul(u); if (u.type === 'tank' && !ap) d *= .22; u.hp -= d; u.flash = .12;
    if (u.hp <= 0) { u.dead = 1; u.dt = 0; if (u.side === 1) { G.money[0] += 5; G.stats.kills++; } else G.stats.lost++; for (let i = 0; i < (u.type === 'tank' ? 22 : 6); i++) fx('dust', u.x, u.y - 14, rnd(-50, 50), rnd(-90, -10)); if (u.type === 'tank') { boom(u.x, u.y - 20, .8); } }
}
function enemies(side) { return G.units.filter(u => u.side !== side && !u.dead); }
function nearestTarget(u, list, rng) { let best = null, bd = rng; for (const e of list) { const d = Math.abs(e.x - u.x); if (d < bd) { bd = d; best = e; } } return best; }
function spawn(side, type) {
    const d = T[type]; if (G.money[side] < d.cost || G.cd[side][type] > 0) return false;
    G.money[side] -= d.cost; G.cd[side][type] = d.cd; if (side === 0) G.stats.spent += d.cost;
    const u = mk(side, type, BASE_X[side] + (side ? -70 : 70)); G.units.push(u); if (side === 0) SND.spawn(); return true;
}
function fx(kind, x, y, vx, vy, extra) { if (G.fx.length > 700) return; G.fx.push(Object.assign({ kind, x, y, vx, vy, t: 0, life: kind === 'smoke' ? 2.4 : kind === 'spark' ? .35 : kind === 'dust' ? .9 : .5 }, extra || {})); }
function boom(x, y, s) {
    s = s || 1; G.fx.push({ kind: 'flash', x, y, t: 0, life: .35, s }); for (let i = 0; i < 12 * s; i++) fx('smoke', x + rnd(-20, 20) * s, y + rnd(-10, 10), rnd(-40, 40), rnd(-70, -20), { s }); for (let i = 0; i < 12 * s; i++) fx('spark', x, y, rnd(-260, 260) * s, rnd(-320, -60) * s);
    for (let i = 0; i < 10 * s; i++) fx('dust', x + rnd(-30, 30) * s, GY + 4, rnd(-120, 120), rnd(-140, -30)); if (Math.abs(x - (G.cam + VW / 2)) < 900) shake = Math.max(shake, 5 * s); SND.boom(.5 + s * .4);
}
function splash(x, rad, dmg, side) { G.units.forEach(u => { if (u.dead || u.side === side) return; const d = Math.abs(u.x - x); if (d < rad) hurt(u, dmg * (1 - d / rad * .7), null, true); }); G.craters.push({ x: x + rnd(-6, 6), r: rad * .28 }); if (G.craters.length > 70) G.craters.shift(); }
function shootShell(u, tgt) { // tank cannon: arcing shell
    const d = T.tank; const sx = u.x + Math.cos(u.aim) * 44, sy = u.y - 36 + Math.sin(u.aim) * 8, tx = tgt.x + rnd(-26, 26), dur = clamp(Math.abs(tx - sx) / 520, .35, 1);
    G.shells.push({ x0: sx, y0: sy, x1: tx, y1: GY + 6, t: 0, dur, arc: 90 + Math.abs(tx - sx) * .12, side: u.side, dmg: d.dmg, rad: d.splash, kind: 'tank' }); u.rec = .25; fx('flash2', sx, sy, 0, 0, { a: u.aim }); SND.shell();
    for (let i = 0; i < 5; i++) fx('smoke', sx, sy, Math.cos(u.aim) * rnd(20, 70), rnd(-30, 0), { s: .5 });
}
function callStrike(side, kind, x) {
    const a = ABIL[kind]; G.abil[side][kind] = a.cd; const n = kind === 'mortar' ? 6 : 15, spread = kind === 'mortar' ? 70 : 240; if (side === 0) SND.ui();
    for (let i = 0; i < n; i++) G.shells.push({ x0: x + rnd(-spread, spread), y0: -80, x1: 0, y1: GY + 6, t: -(.9 + i * (kind === 'mortar' ? .45 : .32) + rnd(0, .25)), dur: .55, arc: 0, side, dmg: kind === 'mortar' ? 58 : 92, rad: kind === 'mortar' ? 58 : 84, kind: 'strike', big: kind === 'arty' });
    G.shells.slice(-n).forEach(s => { s.x1 = s.x0; }); G.markers.push({ x, kind, t: 0, life: 1 + n * (kind === 'mortar' ? .45 : .32) + .5, spread });
    setTimeout(() => SND.whistle(), 300);
}

/* ---------- simulation ---------- */
function step(dt) {
    G.t += dt; if (G.banner.t > 0) G.banner.t -= dt;
    // economy + cooldowns
    for (let s = 0; s < 2; s++) { G.money[s] += G.income[s] * dt; ORDER.forEach(k => { G.cd[s][k] = Math.max(0, G.cd[s][k] - dt); }); G.abil[s].mortar = Math.max(0, G.abil[s].mortar - dt); G.abil[s].arty = Math.max(0, G.abil[s].arty - dt); }
    aiThink(dt);
    // units
    const E = [enemies(0), enemies(1)];
    G.units.forEach(u => {
        if (u.dead) { u.dt += dt; return; } const d = T[u.type], dir = u.side ? -1 : 1, foes = E[u.side]; u.flash = Math.max(0, u.flash - dt); u.rec = Math.max(0, u.rec - dt); u.cool -= dt;
        const tgt = nearestTarget(u, foes, d.rng); u.tgt = tgt; const moving = !tgt && Math.abs(u.x - (BASE_X[1 - u.side] - dir * u.stopOff)) > 6 && ((u.side === 0 && u.x < BASE_X[1] - u.stopOff) || (u.side === 1 && u.x > BASE_X[0] + u.stopOff));
        if (tgt) u.aim = lerp(u.aim, tgt.x > u.x ? 0 : Math.PI, .25); else u.aim = dir > 0 ? 0 : Math.PI;
        if (moving) { u.x += dir * d.sp * dt; u.anim += dt * d.sp * .17; }
        else if (tgt) { fire(u, d, tgt, dt); u.anim += dt * .6; }
    });
    // base guns
    for (let s = 0; s < 2; s++) if (G.lvl[s] >= 1) { G.bt[s] -= dt; if (G.bt[s] <= 0) { const bx = BASE_X[s], t = nearestTarget({ x: bx }, E[s], 480); if (t) { G.bt[s] = .22; const dmg = G.lvl[s] >= 2 ? 6 : 4; G.tracers.push({ x1: bx + (s ? -50 : 50), y1: GY - 64, x2: t.x, y2: t.y - 18, t: 0, life: .09 }); hurt(t, dmg); SND.mg(); } else G.bt[s] = .3; } }
    // shells
    for (let i = G.shells.length - 1; i >= 0; i--) {
        const sh = G.shells[i]; sh.t += dt; if (sh.t < 0) continue;
        if (sh.t >= sh.dur) { const x = sh.x1; boom(x, GY - 6, sh.big ? 1.15 : sh.kind === 'tank' ? .75 : .8); splash(x, sh.rad, sh.dmg, sh.side); G.shells.splice(i, 1); }
    }
    // flames
    for (let i = G.flames.length - 1; i >= 0; i--) { const f = G.flames[i]; f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy -= 30 * dt; if (f.t > f.life) G.flames.splice(i, 1); }
    for (let i = G.tracers.length - 1; i >= 0; i--) { G.tracers[i].t += dt; if (G.tracers[i].t > G.tracers[i].life) G.tracers.splice(i, 1); }
    for (let i = G.fx.length - 1; i >= 0; i--) { const f = G.fx[i]; f.t += dt; f.x += (f.vx || 0) * dt; f.y += (f.vy || 0) * dt; if (f.kind === 'dust' || f.kind === 'spark') f.vy += 380 * dt; if (f.kind === 'smoke') { f.vx *= .98; f.vy *= .985; } if (f.t > f.life) G.fx.splice(i, 1); }
    for (let i = G.markers.length - 1; i >= 0; i--) { G.markers[i].t += dt; if (G.markers[i].t > G.markers[i].life) G.markers.splice(i, 1); }
    // remove corpses
    G.units = G.units.filter(u => !u.dead || u.dt < 5);
    // capture
    for (let b = 0; b < 2; b++) { // base b is being captured by side 1-b
        let atk = 0, def = 0; G.units.forEach(u => { if (u.dead || Math.abs(u.x - BASE_X[b]) > ZONE) return; if (u.side === b) def++; else atk++; });
        if (atk > 0 && def === 0) G.cap[b] = Math.min(100, G.cap[b] + Math.min(atk, 4) * 3.4 * dt); else G.cap[b] = Math.max(0, G.cap[b] - (def > 0 ? 9 : 2) * dt);
        if (G.cap[b] >= 100 && G.state === 'play') { G.state = b === 1 ? 'win' : 'lose'; G.endT = 0; if (b === 1) tone(440, 880, .6, .1, 'triangle'); else tone(300, 80, 1, .1, 'sawtooth'); }
    }
    shake *= Math.pow(.02, dt);
}
function fire(u, d, tgt, dt) {
    const dist = Math.abs(tgt.x - u.x), dir = tgt.x > u.x ? 1 : -1, mx0 = u.x + dir * (u.type === 'tank' ? 44 : u.type === 'sniper' ? 42 : 30), my0 = u.y - (u.type === 'tank' ? 36 : 32);
    const hit = (dmg, chance, tx, ty) => { const h = Math.random() < chance; G.tracers.push({ x1: mx0, y1: my0, x2: h ? tx : tx + dir * rnd(40, 160), y2: h ? ty : ty + rnd(-30, 20), t: 0, life: .08 }); if (h) hurt(tgt, dmg, u); };
    if (u.type === 'flame') {
        if (u.cool <= 0) { u.cool = d.rl; for (let i = 0; i < 3; i++) G.flames.push({ x: mx0, y: my0 + 2, vx: dir * rnd(230, 330), vy: rnd(-30, 30), t: 0, life: rnd(.35, .5) }); G.units.forEach(e => { if (e.dead || e.side === u.side) return; const dx = (e.x - u.x) * dir; if (dx > 0 && dx < d.rng && Math.abs(e.y - u.y) < 30) hurt(e, d.dps * d.rl * (inTrench(e) ? 1.6 : 1), u, true); }); if (Math.random() < .25) SND.flame(); }
        return;
    }
    if (u.cool > 0) return;
    if (u.type === 'rifle') { u.cool = d.rl + rnd(0, .3); hit(d.dmg, clamp(d.acc - dist / d.rng * .32, .3, .9), tgt.x, tgt.y - 18); u.flash = .07; fx('flash2', mx0, my0, 0, 0, { a: dir > 0 ? 0 : Math.PI }); SND.rifle(); }
    else if (u.type === 'sniper') { u.cool = d.rl; hit(d.dmg, .94, tgt.x, tgt.y - 20); fx('flash2', mx0, my0, 0, 0, { a: dir > 0 ? 0 : Math.PI, big: 1 }); SND.sniper(); }
    else if (u.type === 'shotgun') { u.cool = d.rl; for (let i = 0; i < d.pel; i++) hit(d.dmg, clamp(.66 - dist / d.rng * .35, .2, .7), tgt.x, tgt.y - 18 + rnd(-6, 6)); fx('flash2', mx0, my0, 0, 0, { a: dir > 0 ? 0 : Math.PI, big: 1 }); SND.shotgun(); }
    else if (u.type === 'mg') { if (u.burst > 0) { u.cool = d.rl; u.burst--; hit(d.dmg, clamp(.52 - dist / d.rng * .26, .15, .6), tgt.x, tgt.y - 18); fx('flash2', mx0, my0, 0, 0, { a: dir > 0 ? 0 : Math.PI }); if (u.burst % 2) SND.mg(); if (Math.random() < .5) fx('spark', mx0 - dir * 6, my0 + 6, -dir * rnd(10, 40), rnd(-80, -20), {}); } else { u.burst = d.burst; u.cool = d.pause; } }
    else if (u.type === 'tank') { u.cool = d.rl; shootShell(u, tgt); }
}
/* ---------- enemy commander ---------- */
function aiThink(dt) {

}

function pos(e) { const r = cv.getBoundingClientRect(); mx = (e.clientX - r.left) * VW / r.width; my = (e.clientY - r.top) * VH / r.height; }
