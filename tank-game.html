<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gooberglob - Tank Battle</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #151711;
    color: #eee6c8;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 0;
    padding: 16px;
    background: #353d27;
    color: #eee6c8;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 42px;
    letter-spacing: 5px;
    text-shadow: 3px 3px #11140d;
}

#menu {
    max-width: 1000px;
    margin: 25px auto;
    padding: 25px;
    background: #c7bb91;
    border: 5px solid #59613b;
    color: #24251d;
    box-shadow: 8px 8px #090b08;
}

.section {
    margin: 25px 0;
}

.section h2 {
    font-family: "Arial Black", sans-serif;
}

.choices {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;

}

button {

}

}

}

#battleMessage {

}

}

</style>
</head>

<body>

<h1>★ GOOBERGLOB ★</h1>

<div id="menu">

    <h2>⚔️ TANK COMMAND ⚔️</h2>

    <p>
        Choose your faction, tank and battlefield.
    </p>

    <div class="section">

        <h2>1. Choose Your Faction</h2>

        <div class="choices">

            <button
                id="britishButton"
                onclick="chooseFaction('british')">
                🇬🇧 BRITISH
            </button>

            <button
                id="germanButton"
                onclick="chooseFaction('german')">
                🇩🇪 GERMAN
            </button>

        </div>

    </div>

    <div class="section">

        <h2>2. Choose Your Tank</h2>

        <div id="tankChoices" class="choices">
            <p>Choose a faction first.</p>
        </div>

    </div>

    <div class="section">

        <h2>3. Choose Battlefield</h2>

        <div class="choices">

            <button
                id="trenchButton"
                onclick="chooseMap('trenches')">
                🪖 TRENCH FRONT
            </button>

            <button
                id="townButton"
                onclick="chooseMap('town')">
                🏘️ RUINED TOWN
            </button>

        </div>

    </div>

    <button
        id="startButton"
        onclick="startGame()">
        🚀 START BATTLE
    </button>

</div>

<div id="gameArea">

    <div id="gameInfo">

        <div class="infoBox">
            TANK:
            <span id="tankName">---</span>
        </div>

        <div class="infoBox">
            HP:
            <span id="playerHealth">---</span>
        </div>

        <div class="infoBox">
            ENEMIES:
            <span id="enemyCount">---</span>
        </div>

    </div>

    <div id="battleMessage">
        BATTLE!
    </div>

    <canvas
        id="gameCanvas"
        width="1100"
        height="700">
    </canvas>

    <div id="controls">
        W A S D = MOVE
        &nbsp; | &nbsp;
        MOUSE = AIM TURRET
        &nbsp; | &nbsp;
        CLICK / SPACE = FIRE
    </div>

    <button
        id="restartButton"
        onclick="location.reload()">
        🔄 RETURN TO MENU
    </button>

</div>

<script>

/* =====================================================
   TANK DATABASE
===================================================== */

const tanks = {

    british: {

        light: {
            name: "Tetrarch",
            className: "LIGHT",
            health: 90,
            speed: 4.4,
            damage: 18,
            reload: 430,
            size: 24,
            model: "tetrarch"
        },

        medium: {
            name: "Cromwell",
            className: "MEDIUM",
            health: 135,
            speed: 3.2,
            damage: 27,
            reload: 560,
            size: 29,
            model: "cromwell"
        },

        heavy: {
            name: "Churchill",
            className: "HEAVY",
            health: 200,
            speed: 2.2,
            damage: 40,
            reload: 760,
            size: 35,
            model: "churchill"
        }

    },

    german: {

        light: {
            name: "Panzer II",
            className: "LIGHT",
            health: 85,
            speed: 4.4,
            damage: 17,
            reload: 410,
            size: 24,
            model: "panzer2"
        },

        medium: {
            name: "Panzer IV",
            className: "MEDIUM",
            health: 140,
            speed: 3.0,
            damage: 28,
            reload: 570,
            size: 30,
            model: "panzer4"
        },

        heavy: {
            name: "Tiger I",
            className: "HEAVY",
            health: 215,
            speed: 1.9,
            damage: 44,
            reload: 820,
            size: 36,
            model: "tiger"
        }

    }

};


/* =====================================================
   GAME VARIABLES
===================================================== */

let selectedFaction = null;
let selectedTankClass = null;
let selectedMap = null;

let player = null;
let enemies = [];
let shells = [];
let impacts = [];
let obstacles = [];

let keys = {};

let gameRunning = false;

let lastShot = 0;

let mouse = {
    x: 550,
    y: 350
};


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   FACTION
===================================================== */

function chooseFaction(faction) {

    selectedFaction = faction;
    selectedTankClass = null;

    document
        .getElementById("britishButton")
        .classList.remove("selected");

    document
        .getElementById("germanButton")
        .classList.remove("selected");

    document
        .getElementById(faction + "Button")
        .classList.add("selected");

    createTankButtons();

}


/* =====================================================
   TANK BUTTONS
===================================================== */

function createTankButtons() {

    const container =
        document.getElementById("tankChoices");

    container.innerHTML = "";

    for (const type in tanks[selectedFaction]) {

        const tank =
            tanks[selectedFaction][type];

        const button =
            document.createElement("button");

        button.className = "tankCard";

        button.innerHTML =
            tank.name +
            "<small>" +
            tank.className +
            "<br>" +
            "❤️ " + tank.health +
            " &nbsp; ⚡ " + tank.speed +
            "</small>";

        button.onclick = function() {

            selectedTankClass = type;

            document
                .querySelectorAll(".tankCard")
                .forEach(
                    b => b.classList.remove("selected")
                );

            button.classList.add("selected");

        };

        container.appendChild(button);

    }

}


/* =====================================================
   MAP
===================================================== */

function chooseMap(map) {

    selectedMap = map;

    document
        .getElementById("trenchButton")
        .classList.remove("selected");

    document
        .getElementById("townButton")
        .classList.remove("selected");

    const id =
        map === "trenches"
        ? "trenchButton"
        : "townButton";

    document
        .getElementById(id)
        .classList.add("selected");

}


/* =====================================================
   START
===================================================== */

function startGame() {

    if (!selectedFaction) {
        alert("Choose a faction first!");
        return;
    }

    if (!selectedTankClass) {
        alert("Choose a tank first!");
        return;
    }

    if (!selectedMap) {
        alert("Choose a battlefield first!");
        return;
    }

    document
        .getElementById("menu")
        .style.display = "none";

    document
        .getElementById("gameArea")
        .style.display = "block";

    createBattle();

    gameRunning = true;

    requestAnimationFrame(gameLoop);

}


/* =====================================================
   CREATE BATTLE
===================================================== */

function createBattle() {

    const data =
        tanks[selectedFaction][selectedTankClass];

    player = {

        x: 130,
        y: 350,

        /*
           HULL ROTATION
        */
        angle: 0,

        /*
           TURRET ROTATION
        */
        turretAngle: 0,

        health: data.health,
        maxHealth: data.health,

        speed: data.speed,
        damage: data.damage,
        reload: data.reload,

        size: data.size,

        name: data.name,
        model: data.model,
        faction: selectedFaction

    };

    document
        .getElementById("tankName")
        .textContent = player.name;

    shells = [];
    impacts = [];

    createMap();
    createEnemies();

}


/* =====================================================
   MAP CREATION
===================================================== */

function createMap() {

    obstacles = [];

    if (selectedMap === "town") {
        createTownMap();
    } else {
        createTrenchMap();
    }

}


/* =====================================================
   TOWN MAP
===================================================== */

function createTownMap() {

    addObstacle(40, 40, 210, 150, "building");
    addObstacle(290, 45, 150, 115, "building");

    addObstacle(690, 35, 190, 150, "building");
    addObstacle(920, 60, 130, 180, "building");

    addObstacle(35, 470, 190, 170, "building");
    addObstacle(285, 500, 145, 130, "building");

    addObstacle(675, 485, 190, 150, "building");
    addObstacle(925, 430, 140, 190, "building");

    addObstacle(480, 70, 100, 75, "rubble");
    addObstacle(570, 510, 80, 75, "rubble");

    addObstacle(250, 250, 140, 18, "wall");
    addObstacle(710, 275, 150, 18, "wall");

    addObstacle(460, 315, 75, 35, "wreck");
    addObstacle(600, 380, 70, 32, "wreck");

}


/* =====================================================
   TRENCH MAP
===================================================== */

function createTrenchMap() {

    addObstacle(0, 120, 300, 55, "trench");
    addObstacle(360, 100, 280, 55, "trench");
    addObstacle(700, 125, 400, 55, "trench");

    addObstacle(0, 520, 260, 55, "trench");
    addObstacle(320, 545, 310, 55, "trench");
    addObstacle(700, 515, 400, 55, "trench");

    addObstacle(350, 220, 115, 70, "bunker");
    addObstacle(690, 360, 125, 75, "bunker");

    addObstacle(120, 315, 170, 22, "wire");
    addObstacle(820, 300, 180, 22, "wire");

    addObstacle(430, 400, 70, 50, "crater");
    addObstacle(570, 230, 65, 45, "crater");

}


/* =====================================================
   OBSTACLE
===================================================== */

function addObstacle(
    x,
    y,
    width,
    height,
    type
) {

    obstacles.push({
        x,
        y,
        width,
        height,
        type
    });

}


/* =====================================================
   ENEMIES
===================================================== */

function createEnemies() {

    enemies = [];

    const enemyFaction =
        selectedFaction === "british"
        ? "german"
        : "british";

    const types = [
        "light",
        "medium",
        "heavy"
    ];

    const positions = [
        [930, 130],
        [870, 350],
        [950, 570]
    ];

    for (let i = 0; i < 3; i++) {

        const data =
            tanks[enemyFaction][types[i]];

        enemies.push({

            x: positions[i][0],
            y: positions[i][1],

            /*
               HULL
            */
            angle: Math.PI,

            /*
               TURRET
            */
            turretAngle: Math.PI,

            health: data.health,
            maxHealth: data.health,

            speed: data.speed * 0.55,

            damage: data.damage,

            reload: data.reload + 500,

            size: data.size,

            name: data.name,
            model: data.model,
            faction: enemyFaction,

            lastShot: 0

        });

    }

}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = true;

        if (event.code === "Space") {

            event.preventDefault();

            shoot();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();

        mouse.x =
            (
                event.clientX -
                rect.left
            ) *
            canvas.width /
            rect.width;

        mouse.y =
            (
                event.clientY -
                rect.top
            ) *
            canvas.height /
            rect.height;

    }
);


canvas.addEventListener(
    "mousedown",
    function() {

        shoot();

    }
);


/* =====================================================
   SOLID OBSTACLES
===================================================== */

function isSolidObstacle(obstacle) {

    return [

        "building",
        "wall",
        "bunker",
        "wreck"

    ].includes(obstacle.type);

}


/* =====================================================
   TANK COLLISION
===================================================== */

function tankHitsObstacle(
    tank,
    newX = tank.x,
    newY = tank.y
) {

    for (const obstacle of obstacles) {

        if (!isSolidObstacle(obstacle)) {
            continue;
        }

        const closestX =
            Math.max(
                obstacle.x,
                Math.min(
                    newX,
                    obstacle.x + obstacle.width
                )
            );

        const closestY =
            Math.max(
                obstacle.y,
                Math.min(
                    newY,
                    obstacle.y + obstacle.height
                )
            );

        const dx =
            newX - closestX;

        const dy =
            newY - closestY;

        if (
            dx * dx +
            dy * dy <
            tank.size * tank.size
        ) {

            return true;

        }

    }

    return false;

}


/* =====================================================
   LINE / RECTANGLE COLLISION
   Used by shells to hit buildings.
===================================================== */

function lineHitsRectangle(
    x1,
    y1,
    x2,
    y2,
    rect
) {

    const steps = 12;

    for (let i = 0; i <= steps; i++) {

        const t = i / steps;

        const x =
            x1 +
            (x2 - x1) * t;

        const y =
            y1 +
            (y2 - y1) * t;

        if (
            x >= rect.x &&
            x <= rect.x + rect.width &&
            y >= rect.y &&
            y <= rect.y + rect.height
        ) {

            return true;

        }

    }

    return false;

}


/* =====================================================
   SHELL HITS BUILDING
===================================================== */

function shellHitsObstacle(
    oldX,
    oldY,
    newX,
    newY
) {

    for (const obstacle of obstacles) {

        if (!isSolidObstacle(obstacle)) {
            continue;
        }

        if (
            lineHitsRectangle(
                oldX,
                oldY,
                newX,
                newY,
                obstacle
            )
        ) {

            return obstacle;

        }

    }

    return null;

}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer() {

    if (!player) {
        return;
    }

    let dx = 0;
    let dy = 0;

    if (keys["w"]) dy -= 1;
    if (keys["s"]) dy += 1;
    if (keys["a"]) dx -= 1;
    if (keys["d"]) dx += 1;

    if (dx === 0 && dy === 0) {
        return;
    }

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    dx /= length;
    dy /= length;

    /*
       HULL FOLLOWS MOVEMENT
    */

    player.angle =
        Math.atan2(dy, dx);

    const moveX =
        dx * player.speed;

    const moveY =
        dy * player.speed;

    const newX =
        player.x + moveX;

    if (
        !tankHitsObstacle(
            player,
            newX,
            player.y
        )
    ) {

        player.x = newX;

    }

    const newY =
        player.y + moveY;

    if (
        !tankHitsObstacle(
            player,
            player.x,
            newY
        )
    ) {

        player.y = newY;

    }

    player.x =
        Math.max(
            player.size,
            Math.min(
                canvas.width - player.size,
                player.x
            )
        );

    player.y =
        Math.max(
            player.size,
            Math.min(
                canvas.height - player.size,
                player.y
            )
        );

}


/* =====================================================
   PLAYER TURRET AIM
===================================================== */

function aimPlayer() {

    if (!player) {
        return;
    }

    player.turretAngle =
        Math.atan2(
            mouse.y - player.y,
            mouse.x - player.x
        );

}


/* =====================================================
   FIRE
===================================================== */

function shoot() {

    if (!gameRunning || !player) {
        return;
    }

    const now =
        Date.now();

    if (
        now - lastShot <
        player.reload
    ) {

        return;

    }

    lastShot = now;

    createShell(
        player,
        false
    );

}


/* =====================================================
   CREATE SHELL
===================================================== */

function createShell(
    tank,
    enemyShell
) {

    const angle =
        tank.turretAngle;

    const barrelLength =
        tank.size * 1.7;

    const shellX =
        tank.x +
        Math.cos(angle) *
        barrelLength;

    const shellY =
        tank.y +
        Math.sin(angle) *
        barrelLength;

    shells.push({

        x: shellX,
        y: shellY,

        oldX: shellX,
        oldY: shellY,

        vx:
            Math.cos(angle) * 10,

        vy:
            Math.sin(angle) * 10,

        damage:
            tank.damage,

        enemy:
            enemyShell,

        life: 120

    });

}


/* =====================================================
   AI
===================================================== */

function updateEnemies() {

    if (!player) {
        return;
    }

    enemies.forEach(
        function(enemy) {

            const dx =
                player.x - enemy.x;

            const dy =
                player.y - enemy.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            /*
               TURRET AIMS AT PLAYER
            */

            enemy.turretAngle =
                Math.atan2(
                    dy,
                    dx
                );

            /*
               MOVE TOWARD PLAYER
            */

            if (distance > 260) {

                const moveAngle =
                    Math.atan2(
                        dy,
                        dx
                    );

                /*
                   HULL ROTATES
                   independently from turret.
                */

                enemy.angle =
                    moveAngle;

                const moveX =
                    Math.cos(moveAngle) *
                    enemy.speed;

                const moveY =
                    Math.sin(moveAngle) *
                    enemy.speed;

                const newX =
                    enemy.x + moveX;

                if (
                    !tankHitsObstacle(
                        enemy,
                        newX,
                        enemy.y
                    )
                ) {

                    enemy.x = newX;

                }

                const newY =
                    enemy.y + moveY;

                if (
                    !tankHitsObstacle(
                        enemy,
                        enemy.x,
                        newY
                    )
                ) {

                    enemy.y = newY;

                }

            }

            enemy.x =
                Math.max(
                    enemy.size,
                    Math.min(
                        canvas.width - enemy.size,
                        enemy.x
                    )
                );

            enemy.y =
                Math.max(
                    enemy.size,
                    Math.min(
                        canvas.height - enemy.size,
                        enemy.y
                    )
                );

            /*
               FIRE
            */

            const now =
                Date.now();

            if (
                distance < 700 &&
                now - enemy.lastShot >=
                enemy.reload
            ) {

                /*
                   Only fire if there isn't
                   a building directly between
                   the enemy and player.
                */

                if (
                    !shotBlocked(
                        enemy.x,
                        enemy.y,
                        player.x,
                        player.y
                    )
                ) {

                    enemy.lastShot =
                        now;

                    createShell(
                        enemy,
                        true
                    );

                }

            }

        }
    );

}


/* =====================================================
   CHECK IF A SHOT IS BLOCKED
===================================================== */

function shotBlocked(
    x1,
    y1,
    x2,
    y2
) {

    return !!shellHitsObstacle(
        x1,
        y1,
        x2,
        y2
    );

}


/* =====================================================
   UPDATE SHELLS
===================================================== */

function updateShells() {

    for (
        let i = shells.length - 1;
        i >= 0;
        i--
    ) {

        const shell =
            shells[i];

        shell.oldX =
            shell.x;

        shell.oldY =
            shell.y;

        shell.x += shell.vx;
        shell.y += shell.vy;

        shell.life--;

        /*
           BUILDING COLLISION
        */

        const obstacle =
            shellHitsObstacle(
                shell.oldX,
                shell.oldY,
                shell.x,
                shell.y
            );

        if (obstacle) {

            createImpact(
                shell.x,
                shell.y
            );

            shells.splice(i, 1);

            continue;

        }

        /*
           OFFSCREEN
        */

        if (
            shell.x < 0 ||
            shell.x > canvas.width ||
            shell.y < 0 ||
            shell.y > canvas.height ||
            shell.life <= 0
        ) {

            shells.splice(i, 1);

            continue;

        }

        /*
           PLAYER SHELL HITS ENEMY
        */

        if (!shell.enemy) {

            let hit = false;

            for (
                let j = enemies.length - 1;
                j >= 0;
                j--
            ) {

                const enemy =
                    enemies[j];

                const dx =
                    shell.x -
                    enemy.x;

                const dy =
                    shell.y -
                    enemy.y;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );

                if (
                    distance <
                    enemy.size
                ) {

                    enemy.health -=
                        shell.damage;

                    createImpact(
                        shell.x,
                        shell.y
                    );

                    shells.splice(i, 1);

                    hit = true;

                    if (
                        enemy.health <= 0
                    ) {

                        enemies.splice(
                            j,
                            1
                        );

                    }

                    break;

                }

            }

            if (hit) {
                continue;
            }

        }

        /*
           ENEMY SHELL HITS PLAYER
        */

        else {

            const dx =
                shell.x -
                player.x;

            const dy =
                shell.y -
                player.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if (
                distance <
                player.size
            ) {

                player.health -=
                    shell.damage;

                createImpact(
                    shell.x,
                    shell.y
                );

                shells.splice(i, 1);

            }

        }

    }

}


/* =====================================================
   IMPACT EFFECT
===================================================== */

function createImpact(
    x,
    y
) {

    impacts.push({

        x,
        y,

        life: 18,

        maxLife: 18

    });

}


/* =====================================================
   UPDATE IMPACTS
===================================================== */

function updateImpacts() {

    for (
        let i = impacts.length - 1;
        i >= 0;
        i--
    ) {

        impacts[i].life--;

        if (
            impacts[i].life <= 0
        ) {

            impacts.splice(i, 1);

        }

    }

}


/* =====================================================
   DRAW IMPACTS
===================================================== */

function drawImpacts() {

    impacts.forEach(
        function(impact) {

            const progress =
                1 -
                impact.life /
                impact.maxLife;

            const radius =
                8 +
                progress * 24;

            ctx.globalAlpha =
                1 - progress;

            ctx.fillStyle =
                "#e8c66d";

            ctx.beginPath();

            ctx.arc(
                impact.x,
                impact.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle =
                "#342b1b";

            ctx.beginPath();

            ctx.arc(
                impact.x,
                impact.y,
                radius * 0.35,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.globalAlpha = 1;

        }
    );

}


/* =====================================================
   DRAW SHELLS
===================================================== */

function drawShells() {

    shells.forEach(
        function(shell) {

            /*
               TRAIL
            */

            ctx.strokeStyle =
                "#d6b65c";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.moveTo(
                shell.x -
                shell.vx * 1.2,

                shell.y -
                shell.vy * 1.2
            );

            ctx.lineTo(
                shell.x,
                shell.y
            );

            ctx.stroke();

            /*
               SHELL BODY
            */

            ctx.save();

            ctx.translate(
                shell.x,
                shell.y
            );

            ctx.rotate(
                Math.atan2(
                    shell.vy,
                    shell.vx
                )
            );

            ctx.fillStyle =
                "#d0b45d";

            ctx.fillRect(
                -7,
                -3,
                14,
                6
            );

            /*
               POINTED NOSE
            */

            ctx.beginPath();

            ctx.moveTo(
                7,
                -3
            );

            ctx.lineTo(
                12,
                0
            );

            ctx.lineTo(
                7,
                3
            );

            ctx.closePath();

            ctx.fill();

            /*
               DARK BASE
            */

            ctx.fillStyle =
                "#50472e";

            ctx.fillRect(
                -8,
                -3,
                4,
                6
            );

            ctx.restore();

        }
    );

}

/* =====================================================
   BUILDING
===================================================== */

function drawBuilding(o) {

    /*
       SHADOW
    */

    ctx.fillStyle =
        "#292a24";

    ctx.fillRect(
        o.x + 7,
        o.y + 8,
        o.width,
        o.height
    );

    /*
       BUILDING
    */

    ctx.fillStyle =
        "#625f50";

    ctx.fillRect(
        o.x,
        o.y,
        o.width,
        o.height
    );

    /*
       ROOF
    */

    ctx.fillStyle =
        "#403e35";

    ctx.fillRect(
        o.x + 5,
        o.y + 5,
        o.width - 10,
        15
    );

    /*
       WINDOWS
    */

    ctx.fillStyle =
        "#a79a68";

    for (
        let x = o.x + 25;
        x < o.x + o.width - 15;
        x += 45
    ) {

        for (
            let y = o.y + 35;
            y < o.y + o.height - 15;
            y += 45
        ) {

            ctx.fillRect(
                x,
                y,
                20,
                24
            );

        }

    }

    /*
       DOOR
    */

    ctx.fillStyle =
        "#322e25";

    ctx.fillRect(
        o.x +
        o.width / 2 -
        12,

        o.y +
        o.height -
        45,

        24,
        45
    );

}


/* =====================================================
   RUBBLE
===================================================== */

function drawRubble(o) {

    ctx.fillStyle =
        "#48463e";

    ctx.fillRect(
        o.x,
        o.y,
        o.width,
        o.height
    );

    /*
       STATIC RUBBLE.
       No Math.random() here,
       so it doesn't flicker every frame.
    */

    ctx.fillStyle =
        "#292923";

    for (
        let x = o.x + 8;
        x < o.x + o.width - 5;
        x += 20
    ) {

        const height =
            5 +
            ((x * 7) % 9);

        ctx.fillRect(
            x,
            o.y + 8,
            10,
            height
        );

    }

    ctx.fillStyle =
        "#777366";

    for (
        let x = o.x + 15;
        x < o.x + o.width - 5;
        x += 27
    ) {

        ctx.fillRect(
            x,
            o.y + 35,
            9,
            7
        );

    }

}


/* =====================================================
   WALL
===================================================== */

function drawWall(o) {

    ctx.fillStyle =
        "#4d493d";

    ctx.fillRect(
        o.x,
        o.y,
        o.width,
        o.height
    );

    ctx.strokeStyle =
        "#81765d";

    ctx.lineWidth = 2;

    for (
        let x = o.x;
        x < o.x + o.width;
        x += 18
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            o.y
        );

        ctx.lineTo(
            x,
            o.y + o.height
        );

        ctx.stroke();

    }

}


/* =====================================================
   WRECK
===================================================== */

function drawWreck(o) {

    ctx.save();

    ctx.translate(
        o.x + o.width / 2,
        o.y + o.height / 2
    );

    ctx.rotate(-0.35);

    ctx.fillStyle =
        "#292b25";

    ctx.fillRect(
        -35,
        -14,
        70,
        28
    );

    ctx.fillStyle =
        "#414238";

    ctx.fillRect(
        -20,
        -22,
        35,
        25
    );

    ctx.fillStyle =
        "#24251e";

    ctx.fillRect(
        5,
        -3,
        40,
        7
    );

    ctx.restore();

}


/* =====================================================
   TREE
===================================================== */

function drawTree(x, y) {

    ctx.fillStyle =
        "#473a28";

    ctx.fillRect(
        x - 6,
        y,
        12,
        40
    );

    ctx.fillStyle =
        "#303b28";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 8,
        30,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x - 20,
        y + 4,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x + 20,
        y + 4,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =====================================================
   TRENCH MAP
===================================================== */

function drawTrenches() {

    ctx.fillStyle =
        "#756847";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
       MUD MARKINGS
    */

    ctx.fillStyle =
        "#635638";

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const x =
            (i * 173) %
            canvas.width;

        const y =
            (i * 97) %
            canvas.height;

        ctx.fillRect(
            x,
            y,
            20 + i % 30,
            5
        );

    }

    obstacles
        .filter(

        )
        .forEach(

        );

    obstacles
        .filter(
            o => o.type === "bunker"
        )
        .forEach(
            drawBunker
        );

    obstacles
        .filter(
            o => o.type === "wire"
        )
        .forEach(
            drawWire
        );

    obstacles
        .filter(
            o => o.type === "crater"
        )
        .forEach(

        );

/* =====================================================
   BUNKER
===================================================== */

function drawBunker(o) {

    ctx.fillStyle =
        "#37372e";

    ctx.fillRect(
        o.x,

    );

    );

    );

}


/* =====================================================
   BARBED WIRE
===================================================== */

function drawWire(o) {

    ctx.strokeStyle =
        "#282923";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        o.x,
        o.y
    );

    ctx.lineTo(
        o.x + o.width,
        o.y + o.height
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        o.x + o.width,
        o.y
    );

    ctx.lineTo(
        o.x,
        o.y + o.height
    );

    ctx.stroke();

    for (
        let x = o.x + 10;
        x < o.x + o.width;
        x += 30
    ) {

        ctx.beginPath();

        ctx.arc(
            x,
            o.y + 10,
            7,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }

}


/* =====================================================
   CRATER
===================================================== */

function drawCrater(o) {

    ctx.fillStyle =
        "#4d432f";

    ctx.beginPath();

    ctx.ellipse(
        o.x + o.width / 2,
        o.y + o.height / 2,
        o.width / 2,
        o.height / 2,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#292820";

    ctx.beginPath();

    ctx.ellipse(
        o.x + o.width / 2,
        o.y + o.height / 2,
        o.width / 3,
        o.height / 3,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =====================================================
   LOG
===================================================== */

function drawLog(

) {

    ctx.translate(
        x,

    );

    ctx.fillStyle =

    );

    ctx.arc(

        7,
        8,

    );

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   TANK
===================================================== */

function drawTank(tank) {

    ctx.save();

    ctx.translate(
        tank.x,
        tank.y
    );

    /*
       HULL ROTATES
       independently.
    */

    ctx.rotate(
        tank.angle
    );

    drawTankHull(
        tank
    );

    ctx.restore();


    /*
       TURRET ROTATES
       independently.
    */

    ctx.save();

    ctx.translate(
        tank.x,
        tank.y
    );

    ctx.rotate(
        tank.turretAngle
    );

    drawTurret(
        tank
    );

    ctx.restore();


    /*
       HEALTH BAR
    */

    const barWidth =
        tank.size * 2.3;

    ctx.fillStyle =
        "#201f18";

    ctx.fillRect(
        tank.x - barWidth / 2,
        tank.y - tank.size - 15,
        barWidth,
        7
    );

    ctx.fillStyle =
        "#d5c45e";

    ctx.fillRect(
        tank.x - barWidth / 2,
        tank.y - tank.size - 15,
        barWidth *
        Math.max(
            0,
            tank.health /
            tank.maxHealth
        ),
        7
    );

}


/* =====================================================
   HULL
===================================================== */

function drawTankHull(tank) {

    const s =
        tank.size;

    let colour;

    if (
        tank.faction === "british"
    ) {

        colour =
            "#53633b";

    } else {

        colour =
            "#77724e";

    }

    /*
       SHADOW
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.35)";

    ctx.fillRect(
        -s - 4,
        -s + 5,
        s * 2 + 8,
        s * 1.7
    );

    /*
       TRACKS
    */

    ctx.fillStyle =
        "#20231d";

    ctx.fillRect(
        -s,
        -s * 0.78,
        s * 2,
        s * 0.28
    );

    ctx.fillRect(
        -s,
        s * 0.50,
        s * 2,
        s * 0.28
    );

    /*
       TRACK DETAIL
    */

    ctx.fillStyle =
        "#77745d";

    for (
        let x = -s + 7;
        x < s;
        x += 11
    ) {

        ctx.beginPath();

        ctx.arc(
            x,
            -s * 0.64,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            x,
            s * 0.64,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    /*
       HULL
    */

    ctx.fillStyle =
        colour;

    switch (tank.model) {

        case "tetrarch":

            ctx.fillRect(
                -s * 0.72,
                -s * 0.48,
                s * 1.45,
                s * 0.95
            );

            break;

        case "cromwell":

            ctx.beginPath();

            ctx.moveTo(
                -s,
                -s * 0.48
            );

            ctx.lineTo(
                s * 0.85,
                -s * 0.42
            );

            ctx.lineTo(
                s,
                s * 0.48
            );

            ctx.lineTo(
                -s,
                s * 0.48
            );

            ctx.closePath();

            ctx.fill();

            break;

        case "churchill":

            ctx.fillRect(
                -s * 1.05,
                -s * 0.58,
                s * 2.1,
                s * 1.15
            );

            break;

        case "panzer2":

            ctx.fillRect(
                -s * 0.72,
                -s * 0.42,
                s * 1.45,
                s * 0.84
            );

            break;

        case "panzer4":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.95,
                -s * 0.5
            );

            ctx.lineTo(
                s * 0.9,
                -s * 0.5
            );

            ctx.lineTo(
                s,
                s * 0.5
            );

            ctx.lineTo(
                -s * 0.95,
                s * 0.5
            );

            ctx.closePath();

            ctx.fill();

            break;

        case "tiger":

            ctx.fillRect(
                -s * 1.08,
                -s * 0.62,
                s * 2.15,
                s * 1.25
            );

            break;

    }

}


/* =====================================================
   TURRET
===================================================== */

function drawTurret(tank) {

    const s =
        tank.size;

    let turretColour;

    if (
        tank.faction === "british"
    ) {

        turretColour =
            "#657448";

    } else {

        turretColour =
            "#8b855d";

    }

    /*
       CANNON FIRST
       so it sits behind turret.
    */

    drawCannon(
        tank
    );

    /*
       TURRET
    */

    ctx.fillStyle =
        turretColour;

    switch (tank.model) {

        case "tetrarch":

            ctx.fillRect(
                -s * 0.42,
                -s * 0.35,
                s * 0.7,
                s * 0.7
            );

            break;

        case "cromwell":

            ctx.fillRect(
                -s * 0.45,
                -s * 0.42,
                s * 0.9,
                s * 0.84
            );

            break;

        case "churchill":

            ctx.fillRect(
                -s * 0.5,
                -s * 0.48,
                s,
                s * 0.96
            );

            break;

        case "panzer2":

            ctx.fillRect(
                -s * 0.38,
                -s * 0.38,
                s * 0.72,
                s * 0.72
            );

            break;

        case "panzer4":

            ctx.fillRect(
                -s * 0.48,
                -s * 0.43,
                s * 0.9,
                s * 0.86
            );

            break;

        case "tiger":

            ctx.fillRect(
                -s * 0.52,
                -s * 0.5,
                s * 1.05,
                s
            );

            break;

    }

    /*
       TURRET CENTER
    */

    ctx.fillStyle =
        "#34382a";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        s * 0.25,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       MARKINGS
    */

    drawTankMarkings(
        tank
    );

}


/* =====================================================
   CANNON
===================================================== */

function drawCannon(tank) {

    const s =
        tank.size;

    let length =
        s * 1.3;

    let width = 6;

    switch (tank.model) {

        case "tetrarch":
            length = s * 1.15;
            width = 5;
            break;

        case "cromwell":
            length = s * 1.55;
            width = 6;
            break;

        case "churchill":
            length = s * 1.45;
            width = 8;
            break;

        case "panzer2":
            length = s * 1.1;
            width = 5;
            break;

        case "panzer4":
            length = s * 1.6;
            width = 6;
            break;

        case "tiger":
            length = s * 1.85;
            width = 9;
            break;

    }

    ctx.fillStyle =
        "#242820";

    ctx.fillRect(
        0,
        -width / 2,
        length,
        width
    );

    /*
       MUZZLE
    */

    ctx.fillRect(
        length - 7,
        -width / 2 - 2,
        10,
        width + 4
    );

}


/* =====================================================
   TANK MARKINGS
===================================================== */

function drawTankMarkings(tank) {

    const s =
        tank.size;

    if (
        tank.faction === "british"
    ) {

        ctx.strokeStyle =
            "#ddd7ba";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.arc(
            -s * 0.35,
            0,
            s * 0.15,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    } else {

        ctx.fillStyle =
            "#24251e";

        ctx.fillRect(
            -s * 0.15,
            -4,
            s * 0.3,
            8
        );

        ctx.fillRect(
            -4,
            -s * 0.15,
            8,
            s * 0.3
        );

    }

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    document
        .getElementById("playerHealth")
        .textContent =
        Math.max(
            0,
            Math.floor(
                player.health
            )
        );

    document
        .getElementById("enemyCount")
        .textContent =
        enemies.length;

}


/* =====================================================
   GAME STATE
===================================================== */

function checkGameState() {

    if (
        player.health <= 0
    ) {

        gameRunning = false;

        document
            .getElementById("battleMessage")
            .textContent =
            "💀 YOUR TANK HAS BEEN DESTROYED";

        document
            .getElementById("restartButton")
            .style.display =
            "block";

        return;

    }

    if (
        enemies.length === 0
    ) {

        gameRunning = false;

        document
            .getElementById("battleMessage")
            .textContent =
            "🏆 VICTORY! ENEMY FORCES DESTROYED";

        document
            .getElementById("restartButton")
            .style.display =
            "block";

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    if (!gameRunning) {
        return;
    }

    movePlayer();

    aimPlayer();

    updateEnemies();

    updateShells();

    updateImpacts();

    drawMap();

    drawShells();

    drawImpacts();

    enemies.forEach(
        function(enemy) {
            drawTank(enemy);
        }
    );

    drawTank(
        player
    );

    updateUI();

    checkGameState();

    if (gameRunning) {

        requestAnimationFrame(
            gameLoop
        );

    }

}

</script>
