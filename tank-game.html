/* =====================================================

/* =====================================================

===================================================== */

function chooseFaction(faction) {

    selectedFaction = faction;

    selectedTankClass = null;

    document
        .getElementById("britishButton")
        .classList.remove("selected");

    document
        .getElementById("germanButton")
        .classList.remove("selected");

    document
        .getElementById("sovietButton")
        .classList.remove("selected");

    document
        .getElementById(faction + "Button")
        .classList.add("selected");

    createTankButtons();

}


/* =====================================================
   TANK BUTTONS
===================================================== */

function createTankButtons() {

    const container =
        document.getElementById("tankChoices");

    container.innerHTML = "";

    for (
        const type in
        tanks[selectedFaction]
    ) {

        const tank =
            tanks[selectedFaction][type];

        const button =
            document.createElement("button");

        button.className = "tankCard";

        button.innerHTML =
            tank.name +
            "<small>" +
            tank.className +
            "<br>" +
            "❤️ " + tank.health +
            " &nbsp; ⚡ " + tank.speed +
            "</small>";

        button.onclick = function() {

            selectedTankClass = type;

            document
                .querySelectorAll(".tankCard")
                .forEach(
                    b =>
                    b.classList.remove("selected")
                );

            button.classList.add("selected");

        };

        container.appendChild(button);

    }

}


/* =====================================================
   MAP SELECTION
===================================================== */

function chooseMap(map) {

    selectedMap = map;

    document
        .getElementById("trenchButton")
        .classList.remove("selected");

    document
        .getElementById("townButton")
        .classList.remove("selected");

    document
        .getElementById("snowButton")
        .classList.remove("selected");

    let id;

    if (map === "trenches") {
        id = "trenchButton";
    }

    else if (map === "town") {
        id = "townButton";
    }

    else {
        id = "snowButton";
    }

    document
        .getElementById(id)
        .classList.add("selected");

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    if (!selectedFaction) {
        alert("Choose a faction first!");
        return;
    }

    if (!selectedTankClass) {
        alert("Choose a tank first!");
        return;
    }

    if (!selectedMap) {
        alert("Choose a battlefield first!");

    }

    document
        .getElementById("menu")
        .style.display = "none";

    document
        .getElementById("gameArea")
        .style.display = "block";

    createBattle();

    gameRunning = true;

    requestAnimationFrame(gameLoop);

}

/* =====================================================
   ADD OBSTACLE
===================================================== */

function addObstacle(
    x,
    y,
    width,
    height,
    type
) {

    obstacles.push({

        x: x,
        y: y,

        width: width,
        height: height,

        type: type

    });

}


/* =====================================================
   SOLID OBSTACLES
===================================================== */

function isSolidObstacle(obstacle) {

    return [

        "building",
        "wall",
        "bunker",
        "wreck",
        "snowCabin",
        "rock"

    ].includes(obstacle.type);

}


/* =====================================================
   TANK COLLISION
===================================================== */

function tankHitsObstacle(
    tank,
    newX = tank.x,
    newY = tank.y
) {

    for (
        const obstacle of obstacles
    ) {

        if (
            !isSolidObstacle(obstacle)
        ) {
            continue;
        }

        const closestX =
            Math.max(
                obstacle.x,

                Math.min(
                    newX,
                    obstacle.x +
                    obstacle.width
                )
            );

        const closestY =
            Math.max(
                obstacle.y,

                Math.min(
                    newY,
                    obstacle.y +
                    obstacle.height
                )
            );

        const dx =
            newX -
            closestX;

        const dy =
            newY -
            closestY;

        if (
            dx * dx +
            dy * dy <
            tank.size *
            tank.size
        ) {

            return true;

        }

    }

    return false;

}


/* =====================================================
   SAFE SPAWN SYSTEM
===================================================== */

function validSpawnPoint(
    x,
    y,
    size
) {

    if (
        x < size + 10 ||
        x >
        canvas.width -
        size -
        10 ||

        y < size + 10 ||
        y >
        canvas.height -
        size -
        10
    ) {

        return false;

    }

    const fakeTank = {

        x: x,
        y: y,
        size: size

    };

    if (
        tankHitsObstacle(
            fakeTank,
            x,
            y
        )
    ) {

        return false;

    }

    /*
       Don't spawn right next
       to the player.
    */

    if (player) {

        const dx =
            x -
            player.x;

        const dy =
            y -
            player.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (
            distance < 220
        ) {

            return false;

        }

    }

    /*
       Don't overlap another
       enemy.
    */

    for (
        const enemy of enemies
    ) {

        const dx =
            x -
            enemy.x;

        const dy =
            y -
            enemy.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (
            distance <
            size +
            enemy.size +
            35
        ) {

            return false;

        }

    }

    return true;

}


/* =====================================================
   FIND SAFE SPAWN
===================================================== */

function findSpawnPoint(
    preferred,
    size
) {

    if (
        validSpawnPoint(
            preferred[0],
            preferred[1],
            size
        )
    ) {

        return {

            x: preferred[0],
            y: preferred[1]

        };

    }

    /*
       Search the entire map
       if preferred location is blocked.
    */

    for (
        let y = 45;
        y < canvas.height - 45;
        y += 45
    ) {

        for (
            let x = 45;
            x < canvas.width - 45;
            x += 45
        ) {

            if (
                validSpawnPoint(
                    x,
                    y,
                    size
                )
            ) {

                return {
                    x: x,
                    y: y
                };

            }

        }

    }

    /*
       Emergency fallback.
    */

    return {

        x:
            canvas.width -
            size -
            20,

        y:
            canvas.height / 2

    };

}


/* =====================================================
   CREATE ENEMIES
===================================================== */

function createEnemies() {

    enemies = [];

    /*
       Enemy faction cycle:
       British -> German
       German -> Soviet
       Soviet -> British
    */

    let enemyFaction;

    if (
        selectedFaction === "british"
    ) {

        enemyFaction = "german";

    }

    else if (
        selectedFaction === "german"
    ) {

        enemyFaction = "soviet";

    }

    else {

        enemyFaction = "british";

    }


    const types = [

        "light",
        "medium",
        "heavy"

    ];


    /*
       IMPORTANT:
       The old city spawn points could
       overlap buildings.

       These are now checked by
       findSpawnPoint().
    */

    let preferred;

    if (
        selectedMap === "town"
    ) {

        preferred = [

            [560, 90],
            [560, 350],
            [560, 620]

        ];

    }

    else if (
        selectedMap === "snow"
    ) {

        preferred = [

            [1000, 120],
            [930, 350],
            [1000, 620]

        ];

    }

    else {

        preferred = [

            [930, 130],
            [870, 350],
            [950, 570]

        ];

    }


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const data =
            tanks[enemyFaction]
            [types[i]];


        const spawn =
            findSpawnPoint(
                preferred[i],
                data.size
            );


        enemies.push({

            x: spawn.x,
            y: spawn.y,

            angle: Math.PI,

            turretAngle: Math.PI,

            health: data.health,
            maxHealth: data.health,

            speed:
                data.speed *
                0.55,

            damage:
                data.damage,

            reload:
                data.reload +
                500,

            size:
                data.size,

            name:
                data.name,

            model:
                data.model,

            faction:
                enemyFaction,

            lastShot:
                0

        });

    }

}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = true;

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            shoot();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();

        mouse.x =
            (
                event.clientX -
                rect.left
            ) *
            canvas.width /
            rect.width;

        mouse.y =
            (
                event.clientY -
                rect.top
            ) *
            canvas.height /
            rect.height;

    }
);


canvas.addEventListener(
    "mousedown",
    function() {

        shoot();

    }
);


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys["w"]) {
        dy--;
    }

    if (keys["s"]) {
        dy++;
    }

    if (keys["a"]) {
        dx--;
    }

    if (keys["d"]) {
        dx++;
    }

    if (
        dx === 0 &&
        dy === 0
    ) {

        return;

    }

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    dx /= length;
    dy /= length;


    /*
       Tank hull rotates
       with movement.
    */

    player.angle =
        Math.atan2(
            dy,
            dx
        );


    const moveX =
        dx *
        player.speed;

    const moveY =
        dy *
        player.speed;


    if (
        !tankHitsObstacle(
            player,
            player.x +
            moveX,
            player.y
        )
    ) {

        player.x += moveX;

    }


    if (
        !tankHitsObstacle(
            player,
            player.x,
            player.y +
            moveY
        )
    ) {

        player.y += moveY;

    }


    player.x =
        Math.max(
            player.size,

            Math.min(
                canvas.width -
                player.size,

                player.x
            )
        );


    player.y =
        Math.max(
            player.size,

            Math.min(
                canvas.height -
                player.size,

                player.y
            )
        );

}


/* =====================================================
   PLAYER AIM
===================================================== */

function aimPlayer() {

    player.turretAngle =
        Math.atan2(

            mouse.y -
            player.y,

            mouse.x -
            player.x

        );

}


/* =====================================================
   PLAYER SHOOT
===================================================== */

function shoot() {

    if (
        !gameRunning ||
        !player
    ) {

        return;

    }

    const now =
        Date.now();


    if (
        now -
        lastShot <
        player.reload
    ) {

        return;

    }


    lastShot =
        now;


    createShell(
        player,
        false
    );

}


/* =====================================================
   CREATE SHELL
===================================================== */

function createShell(
    tank,
    enemyShell
) {

    const angle =
        tank.turretAngle;

    const barrelLength =
        tank.size *
        1.7;


    const shellX =
        tank.x +
        Math.cos(angle) *
        barrelLength;

    const shellY =
        tank.y +
        Math.sin(angle) *
        barrelLength;


    shells.push({

        x: shellX,
        y: shellY,

        oldX: shellX,
        oldY: shellY,

        vx:
            Math.cos(angle) *
            10,

        vy:
            Math.sin(angle) *
            10,

        damage:
            tank.damage,

        enemy:
            enemyShell,

        life:
            120

    });

}


/* =====================================================
   LINE / RECTANGLE COLLISION
===================================================== */

function lineHitsRectangle(
    x1,
    y1,
    x2,
    y2,
    rect
) {

    const steps = 14;

    for (
        let i = 0;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;

        const x =
            x1 +
            (x2 - x1) *
            t;

        const y =
            y1 +
            (y2 - y1) *
            t;


        if (

            x >= rect.x &&

            x <=
            rect.x +
            rect.width &&

            y >= rect.y &&

            y <=
            rect.y +
            rect.height

        ) {

            return true;

        }

    }

    return false;

}


/* =====================================================
   SHELL OBSTACLE
===================================================== */

function shellHitsObstacle(
    oldX,
    oldY,
    newX,
    newY
) {

    for (
        const obstacle of
        obstacles
    ) {

        if (
            !isSolidObstacle(
                obstacle
            )
        ) {

            continue;

        }


        if (
            lineHitsRectangle(
                oldX,
                oldY,
                newX,
                newY,
                obstacle
            )
        ) {

            return obstacle;

        }

    }

    return null;

}


/* =====================================================
   AI
===================================================== */

function updateEnemies() {

    if (!player) {
        return;
    }


    enemies.forEach(
        function(enemy) {

            const dx =
                player.x -
                enemy.x;

            const dy =
                player.y -
                enemy.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
               Turret always aims
               separately from hull.
            */

            enemy.turretAngle =
                Math.atan2(
                    dy,
                    dx
                );


            /*
               Move toward player.
            */

            if (
                distance > 260
            ) {

                const moveAngle =
                    Math.atan2(
                        dy,
                        dx
                    );


                enemy.angle =
                    moveAngle;


                const moveX =
                    Math.cos(
                        moveAngle
                    ) *
                    enemy.speed;

                const moveY =
                    Math.sin(
                        moveAngle
                    ) *
                    enemy.speed;


                if (
                    !tankHitsObstacle(
                        enemy,
                        enemy.x +
                        moveX,
                        enemy.y
                    )
                ) {

                    enemy.x +=
                        moveX;

                }


                if (
                    !tankHitsObstacle(
                        enemy,
                        enemy.x,
                        enemy.y +
                        moveY
                    )
                ) {

                    enemy.y +=
                        moveY;

                }

            }


            enemy.x =
                Math.max(
                    enemy.size,

                    Math.min(
                        canvas.width -
                        enemy.size,

                        enemy.x
                    )
                );


            enemy.y =
                Math.max(
                    enemy.size,

                    Math.min(
                        canvas.height -
                        enemy.size,

                        enemy.y
                    )
                );


            /*
               AI SHOOTING
            */

            const now =
                Date.now();


            if (

                distance < 700 &&

                now -
                enemy.lastShot >=
                enemy.reload

            ) {

                /*
                   Buildings block
                   line of fire.
                */

                if (
                    !shotBlocked(
                        enemy.x,
                        enemy.y,
                        player.x,
                        player.y
                    )
                ) {

                    enemy.lastShot =
                        now;

                    createShell(
                        enemy,
                        true
                    );

                }

            }

        }
    );

}


/* =====================================================
   SHOT BLOCKED
===================================================== */

function shotBlocked(
    x1,
    y1,
    x2,
    y2
) {

    return !!shellHitsObstacle(
        x1,
        y1,
        x2,
        y2
    );

}


/* =====================================================
   SHELL UPDATE
===================================================== */

function updateShells() {

    for (
        let i =
            shells.length - 1;

        i >= 0;

        i--
    ) {

        const shell =
            shells[i];


        shell.oldX =
            shell.x;

        shell.oldY =
            shell.y;


        shell.x +=
            shell.vx;

        shell.y +=
            shell.vy;


        shell.life--;


        /*
           SHELL HITS BUILDING
        */

        if (
            shellHitsObstacle(
                shell.oldX,
                shell.oldY,
                shell.x,
                shell.y
            )
        ) {

            createImpact(
                shell.x,
                shell.y
            );

            shells.splice(
                i,
                1
            );

            continue;

        }


        /*
           OFF SCREEN
        */

        if (

            shell.x < 0 ||

            shell.x >
            canvas.width ||

            shell.y < 0 ||

            shell.y >
            canvas.height ||

            shell.life <= 0

        ) {

            shells.splice(
                i,
                1
            );

            continue;

        }


        /*
           PLAYER SHELL
        */

        if (
            !shell.enemy
        ) {

            let hit = false;


            for (
                let j =
                    enemies.length - 1;

                j >= 0;

                j--
            ) {

                const enemy =
                    enemies[j];


                const dx =
                    shell.x -
                    enemy.x;

                const dy =
                    shell.y -
                    enemy.y;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance <
                    enemy.size
                ) {

                    enemy.health -=
                        shell.damage;


                    createImpact(
                        shell.x,
                        shell.y
                    );


                    shells.splice(
                        i,
                        1
                    );


                    hit = true;


                    if (
                        enemy.health <= 0
                    ) {

                        enemies.splice(
                            j,
                            1
                        );

                    }


                    break;

                }

            }


            if (hit) {
                continue;
            }

        }


        /*
           ENEMY SHELL
        */

        else {

            const dx =
                shell.x -
                player.x;

            const dy =
                shell.y -
                player.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                player.size
            ) {

                player.health -=
                    shell.damage;


                createImpact(
                    shell.x,
                    shell.y
                );


                shells.splice(
                    i,
                    1
                );

            }

        }

    }

}


/* =====================================================
   IMPACTS
===================================================== */

function createImpact(
    x,
    y
) {

    impacts.push({

        x: x,
        y: y,

        life: 18,

        maxLife: 18

    });

}


function updateImpacts() {

    for (
        let i =
            impacts.length - 1;

        i >= 0;

        i--
    ) {

        impacts[i].life--;

        if (
            impacts[i].life <= 0
        ) {

            impacts.splice(
                i,
                1
            );

        }

    }

}

    ctx.moveTo(
        o.x - 8,
        o.y + 10
    );

    ctx.lineTo(
        o.x +
        o.width / 2,
        o.y - 25
    );

    ctx.lineTo(
        o.x +
        o.width + 8,
        o.y + 10
    );

    ctx.lineTo(
        o.x +
        o.width,
        o.y + 5
    );

    ctx.lineTo(
        o.x +
        o.width / 2,
        o.y - 14
    );

    ctx.lineTo(
        o.x,
        o.y + 5
    );

    ctx.closePath();

    ctx.fill();


    /*
       WINDOWS
    */

    ctx.fillStyle =
        "#a9d0d7";

    ctx.fillRect(
        o.x + 20,
        o.y + 30,
        24,
        20
    );

    ctx.fillRect(
        o.x +
        o.width -
        44,
        o.y + 30,
        24,
        20
    );


    /*
       DOOR
    */

    ctx.fillStyle =
        "#39291f";

    ctx.fillRect(
        o.x +
        o.width / 2 -
        12,

        o.y +
        o.height -
        42,

        24,
        42
    );

}


/* =====================================================
   SNOW ROCK
===================================================== */

function drawSnowRock(o) {

    ctx.fillStyle =
        "#89999c";

    ctx.beginPath();

    ctx.ellipse(
        o.x +
        o.width / 2,

        o.y +
        o.height / 2,

        o.width / 2,

        o.height / 2,

        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#dce5e6";

    ctx.beginPath();

    ctx.ellipse(
        o.x +
        o.width * 0.42,

        o.y +
        o.height * 0.32,

        o.width * 0.3,

        o.height * 0.18,

        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =====================================================
   TANK DRAWING
===================================================== */

function drawTank(tank) {

    /*
       HULL
    */

    ctx.save();

    ctx.translate(
        tank.x,
        tank.y
    );

    ctx.rotate(
        tank.angle
    );

    drawTankHull(
        tank
    );

    ctx.restore();


    /*
       TURRET
    */

    ctx.save();

    ctx.translate(
        tank.x,
        tank.y
    );

    ctx.rotate(
        tank.turretAngle
    );

    drawTurret(
        tank
    );

    ctx.restore();


    /*
       HEALTH BAR
    */

    const barWidth =
        tank.size *
        2.3;


    ctx.fillStyle =
        "#201f18";

    ctx.fillRect(
        tank.x -
        barWidth / 2,

        tank.y -
        tank.size -
        15,

        barWidth,
        7
    );


    ctx.fillStyle =
        "#d5c45e";

    ctx.fillRect(
        tank.x -
        barWidth / 2,

        tank.y -
        tank.size -
        15,

        barWidth *
        Math.max(
            0,
            tank.health /
            tank.maxHealth
        ),

        7
    );

}


/* =====================================================
   TANK HULL
===================================================== */

function drawTankHull(tank) {

    const s =
        tank.size;


    let colour;


    if (
        tank.faction ===
        "british"
    ) {

        colour =
            "#53633b";

    }

    else if (
        tank.faction ===
        "german"
    ) {

        colour =
            "#77724e";

    }

    else {

        colour =
            "#4d6738";

    }


    /*
       SHADOW
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.35)";

    ctx.fillRect(
        -s - 4,
        -s + 5,
        s * 2 + 8,
        s * 1.7
    );


    /*
       TRACKS
    */

    ctx.fillStyle =
        "#20231d";

    ctx.fillRect(
        -s,
        -s * 0.78,
        s * 2,
        s * 0.28
    );

    ctx.fillRect(
        -s,
        s * 0.50,
        s * 2,
        s * 0.28
    );


    /*
       TRACK WHEELS
    */

    ctx.fillStyle =
        "#77745d";


    for (
        let x =
            -s + 7;

        x < s;

        x += 11
    ) {

        ctx.beginPath();

        ctx.arc(
            x,
            -s * 0.64,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            x,
            s * 0.64,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /*
       HULL SHAPE
    */

    ctx.fillStyle =
        colour;


    switch (
        tank.model
    ) {

        case "tetrarch":

            ctx.fillRect(
                -s * 0.72,
                -s * 0.48,
                s * 1.45,
                s * 0.95
            );

            break;


        case "cromwell":

            ctx.beginPath();

            ctx.moveTo(
                -s,
                -s * 0.48
            );

            ctx.lineTo(
                s * 0.85,
                -s * 0.42
            );

            ctx.lineTo(
                s,
                s * 0.48
            );

            ctx.lineTo(
                -s,
                s * 0.48
            );

            ctx.closePath();

            ctx.fill();

            break;


        case "churchill":

            ctx.fillRect(
                -s * 1.05,
                -s * 0.58,
                s * 2.1,
                s * 1.15
            );

            break;


        case "panzer2":

            ctx.fillRect(
                -s * 0.72,
                -s * 0.42,
                s * 1.45,
                s * 0.84
            );

            break;


        case "panzer4":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.95,
                -s * 0.5
            );

            ctx.lineTo(
                s * 0.9,
                -s * 0.5
            );

            ctx.lineTo(
                s,
                s * 0.5
            );

            ctx.lineTo(
                -s * 0.95,
                s * 0.5
            );

            ctx.closePath();

            ctx.fill();

            break;


        case "tiger":

            ctx.fillRect(
                -s * 1.08,
                -s * 0.62,
                s * 2.15,
                s * 1.25
            );

            break;


        /*
           SOVIET
        */

        case "t70":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.8,
                -s * 0.45
            );

            ctx.lineTo(
                s * 0.8,
                -s * 0.45
            );

            ctx.lineTo(
                s * 0.95,
                s * 0.4
            );

            ctx.lineTo(
                -s * 0.9,
                s * 0.4
            );

            ctx.closePath();

            ctx.fill();

            break;


        case "t34":

            ctx.beginPath();

            ctx.moveTo(
                -s,
                -s * 0.5
            );

            ctx.lineTo(
                s * 0.75,
                -s * 0.6
            );

            ctx.lineTo(
                s,
                s * 0.35
            );

            ctx.lineTo(
                -s * 0.9,
                s * 0.5
            );

            ctx.closePath();

            ctx.fill();

            break;


        case "is2":

            ctx.fillRect(
                -s * 1.08,
                -s * 0.6,
                s * 2.16,
                s * 1.2
            );

            break;

    }

}


/* =====================================================
   TURRET
===================================================== */

function drawTurret(tank) {

    const s =
        tank.size;


    let colour;


    if (
        tank.faction ===
        "british"
    ) {

        colour =
            "#657448";

    }

    else if (
        tank.faction ===
        "german"
    ) {

        colour =
            "#8b855d";

    }

    else {

        colour =
            "#5d7845";

    }


    /*
       CANNON FIRST
    */

    drawCannon(
        tank
    );


    /*
       TURRET
    */

    ctx.fillStyle =
        colour;


    switch (
        tank.model
    ) {

        case "tetrarch":

            ctx.fillRect(
                -s * 0.42,
                -s * 0.35,
                s * 0.7,
                s * 0.7
            );

            break;


        case "cromwell":

            ctx.fillRect(
                -s * 0.45,
                -s * 0.42,
                s * 0.9,
                s * 0.84
            );

            break;


        case "churchill":

            ctx.fillRect(
                -s * 0.5,
                -s * 0.48,
                s,
                s * 0.96
            );

            break;


        case "panzer2":

            ctx.fillRect(
                -s * 0.38,
                -s * 0.38,
                s * 0.72,
                s * 0.72
            );

            break;


        case "panzer4":

            ctx.fillRect(
                -s * 0.48,
                -s * 0.43,
                s * 0.9,
                s * 0.86
            );

            break;


        case "tiger":

            ctx.fillRect(
                -s * 0.52,
                -s * 0.5,
                s * 1.05,
                s
            );

            break;


        case "t70":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.4,
                -s * 0.4
            );

            ctx.lineTo(
                s * 0.35,
                -s * 0.28
            );

            ctx.lineTo(
                s * 0.4,
                s * 0.4
            );

            ctx.lineTo(
                -s * 0.4,
                s * 0.3
            );

            ctx.closePath();

            ctx.fill();

            break;


        case "t34":

            ctx.beginPath();

            ctx.moveTo(
                -s * 0.48,
                -s * 0.4
            );

            ctx.lineTo(
                s * 0.4,
                -s * 0.38
            );

            ctx.lineTo(
                s * 0.45,
                s * 0.4
            );

            ctx.lineTo(
                -s * 0.5,
                s * 0.35
            );

            ctx.closePath();

            ctx.fill();

            break;


        case "is2":

            ctx.fillRect(
                -s * 0.52,
                -s * 0.5,
                s * 1.05,
                s
            );

            break;

    }


    /*
       TURRET CENTER
    */

    ctx.fillStyle =
        "#34382a";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        s * 0.25,
        0,
        Math.PI * 2
    );

    ctx.fill();


    drawTankMarkings(
        tank
    );

}


/* =====================================================
   CANNON
===================================================== */

function drawCannon(tank) {

    const s =
        tank.size;


    let length =
        s * 1.3;

    let width = 6;


    switch (
        tank.model
    ) {

        case "tetrarch":
            length = s * 1.15;
            width = 5;
            break;

        case "cromwell":
            length = s * 1.55;
            width = 6;
            break;

        case "churchill":
            length = s * 1.45;
            width = 8;
            break;

        case "panzer2":
            length = s * 1.1;
            width = 5;
            break;

        case "panzer4":
            length = s * 1.6;
            width = 6;
            break;

        case "tiger":
            length = s * 1.85;
            width = 9;
            break;

        case "t70":
            length = s * 1.25;
            width = 5;
            break;

        case "t34":
            length = s * 1.65;
            width = 7;
            break;

        case "is2":
            length = s * 1.9;
            width = 9;
            break;

    }


    ctx.fillStyle =
        "#242820";


    ctx.fillRect(
        0,
        -width / 2,
        length,
        width
    );


    ctx.fillRect(
        length - 7,
        -width / 2 - 2,
        10,
        width + 4
    );

}


/* =====================================================
   TANK MARKINGS
===================================================== */

function drawTankMarkings(tank) {

    const s =
        tank.size;


    if (
        tank.faction ===
        "british"
    ) {

        ctx.strokeStyle =
            "#ddd7ba";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.arc(
            -s * 0.35,
            0,
            s * 0.15,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }

    else if (
        tank.faction ===
        "german"
    ) {

        ctx.fillStyle =
            "#24251e";

        ctx.fillRect(
            -s * 0.15,
            -4,
            s * 0.3,
            8
        );

        ctx.fillRect(
            -4,
            -s * 0.15,
            8,
            s * 0.3
        );

    }

    else {

        /*
           Soviet red-star-ish
           simple marking.
        */

        ctx.fillStyle =
            "#c7c7bd";

        ctx.fillRect(
            -s * 0.38,
            -3,
            s * 0.76,
            6
        );

        ctx.fillRect(
            -3,
            -s * 0.38,
            6,
            s * 0.76
        );

    }

}


/* =====================================================
   SHELL DRAWING
===================================================== */

function drawShells() {

    shells.forEach(
        function(shell) {

            /*
               SHELL TRAIL
            */

            ctx.strokeStyle =
                "#d6b65c";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.moveTo(
                shell.x -
                shell.vx * 1.2,

                shell.y -
                shell.vy * 1.2
            );

            ctx.lineTo(
                shell.x,
                shell.y
            );

            ctx.stroke();


            /*
               SHELL
            */

            ctx.save();

            ctx.translate(
                shell.x,
                shell.y
            );

            ctx.rotate(
                Math.atan2(
                    shell.vy,
                    shell.vx
                )
            );


            ctx.fillStyle =
                "#d0b45d";

            ctx.fillRect(
                -7,
                -3,
                14,
                6
            );


            /*
               POINTED NOSE
            */

            ctx.beginPath();

            ctx.moveTo(
                7,
                -3
            );

            ctx.lineTo(
                12,
                0
            );

            ctx.lineTo(
                7,
                3
            );

            ctx.closePath();

            ctx.fill();


            /*
               DARK BASE
            */

            ctx.fillStyle =
                "#50472e";

            ctx.fillRect(
                -8,
                -3,
                4,
                6
            );


            ctx.restore();

        }
    );

}


/* =====================================================
   IMPACT DRAWING
===================================================== */

function drawImpacts() {

    impacts.forEach(
        function(impact) {

            const progress =
                1 -
                impact.life /
                impact.maxLife;

            const radius =
                8 +
                progress *
                24;


            ctx.globalAlpha =
                1 -
                progress;


            ctx.fillStyle =
                "#e8c66d";

            ctx.beginPath();

            ctx.arc(
                impact.x,
                impact.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                "#342b1b";

            ctx.beginPath();

            ctx.arc(
                impact.x,
                impact.y,
                radius * 0.35,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.globalAlpha = 1;

        }
    );

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    document
        .getElementById("playerHealth")
        .textContent =
        Math.max(
            0,
            Math.floor(
                player.health
            )
        );


    document
        .getElementById("enemyCount")
        .textContent =
        enemies.length;

}


/* =====================================================
   GAME STATE
===================================================== */

function checkGameState() {

    if (
        player.health <= 0
    ) {

        gameRunning = false;

        document
            .getElementById("battleMessage")
            .textContent =
            "💀 YOUR TANK HAS BEEN DESTROYED";

        document
            .getElementById("restartButton")
            .style.display =
            "block";

        return;

    }


    if (
        enemies.length === 0
    ) {

        gameRunning = false;

        document
            .getElementById("battleMessage")
            .textContent =
            "🏆 VICTORY! ENEMY FORCES DESTROYED";

        document
            .getElementById("restartButton")
            .style.display =
            "block";

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    if (!gameRunning) {
        return;
    }


    movePlayer();

    aimPlayer();

    updateEnemies();

    updateShells();

    updateImpacts();


    drawMap();

    drawShells();

    drawImpacts();


    enemies.forEach(
        function(enemy) {

            drawTank(enemy);

        }
    );


    drawTank(
        player
    );


    updateUI();

    checkGameState();


    if (gameRunning) {

        requestAnimationFrame(
            gameLoop
        );

    }

}

</script>
